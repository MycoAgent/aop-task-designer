  else for(let i=0;i<count;i++)ids.push(prefix+'-'+i);
  togIds(ids);
}

/* ========== task.md parser ========== */
function parseFrontMatter(text){
  const m=text.match(/^---\r?\n([\s\S]*?)\r?\n---/);
  if(!m)return{};
  const result={};
  for(const line of m[1].split('\n')){
    const kv=line.match(/^(\w+):\s*(.+)$/);
    if(kv)result[kv[1]]=kv[2].replace(/^['"]|['"]$/g,'');
  }
  return result;
}
function parseMdSections(body){
  const sections={O:[],S:[],A:[],R:[],actors:[],datasets:[],subtasks:[]};
  // Limit rosa search to ## 问题空间 section only
  const psStart=body.match(/^##\s*(?:问题空间|Problem)\s*\n/gm);
  const rosaBody=psStart?(()=>{const i=body.indexOf(psStart[0])+psStart[0].length;const e=body.indexOf('\n## ',i);return e>0?body.slice(i,e):body.slice(i);})():body;
  const sectionRe=/^###\s*([OSARosar])\s*[（(—\-].*\n/gm;
  const found=[];let m;
  while((m=sectionRe.exec(rosaBody))!==null)
    found.push({letter:m[1].toUpperCase(),start:m.index+m[0].length,headingIdx:m.index});
  for(let i=0;i<found.length;i++){
    let end=i+1<found.length?found[i+1].headingIdx:rosaBody.length;
    const text=rosaBody.slice(found[i].start,end);
    const letter=found[i].letter;
    if('OSA'.includes(letter))parseRosaSection(text,sections,letter);
    else if(letter==='R')parseRosaSection(text,sections,letter);
  }
  const rewardRe=/^##\s*评价标准\s*\n/gm;
  while((m=rewardRe.exec(body))!==null){
    const start=m.index+m[0].length;
    const end=body.indexOf('\n## ',start);
    parseRosaSection(body.slice(start,end>0?end:body.length),sections,'R');
  }
  const actorsRe=/^##\s*(?:Actors?|对象)\s*\n/gm;let am;
  while((am=actorsRe.exec(body))!==null){
    const start=am.index+am[0].length;
    const nextH2=body.indexOf('\n## ',start);
    const actorText=nextH2>0?body.slice(start,nextH2):body.slice(start);
    parseActorsSection(actorText,sections);
  }
  // Parse ## Datasets section
  const dsRe=/^##\s*Datasets?\s*\n/gm;let dm;
  while((dm=dsRe.exec(body))!==null){
    const start=dm.index+dm[0].length;
    const nextH2=body.indexOf('\n## ',start);
    const dsText=nextH2>0?body.slice(start,nextH2):body.slice(start);
    const parsed=parseDatasetsSection(dsText);
    sections.datasets.push(...parsed);
  }
  // Parse ## 子任务 section (分形递归：父任务某 PCDATR 层挂子 Task)
  const subRe=/^##\s*子任务\s*\n/gm;let sum;
  while((sum=subRe.exec(body))!==null){
    const start=sum.index+sum[0].length;
    const nextH2=body.indexOf('\n## ',start);
    const subText=nextH2>0?body.slice(start,nextH2):body.slice(start);
    sections.subtasks.push(...parseSubtasksSection(subText));
  }
  // Parse ## 解空间 or ## PCDATR section
  const pcdRe=/^##\s*(?:解空间|PCDATR)\s*\n/gm;let pm;
  while((pm=pcdRe.exec(body))!==null){
    const start=pm.index+pm[0].length;
    const nextH2=body.indexOf('\n## ',start);
    const pcdText=nextH2>0?body.slice(start,nextH2):body.slice(start);
    const parsed=parsePcdatrSkills(pcdText);
    if(Object.keys(parsed).length)sections.agents=parsed;
  }
  parsePcdatrStatus(body);
  return sections;
}
function parsePcdatrStatus(body){
  const re=/^###\s*([PCDATRpcdatr])\s*[（(—\-\s]/gm;
  const sections=[];let m;
  while((m=re.exec(body))!==null)sections.push({layer:m[1].toUpperCase(),start:m.index+m[0].length});
  for(let i=0;i<sections.length;i++){
    const end=i+1<sections.length?sections[i+1].start-1:body.length;
    const text=body.slice(sections[i].start,end);
    const layer=sections[i].layer;
    const chkRe=/^-\s*\[([ xX])\]\s*`([^`\/]+)[\/]?\s*`/gm;let cm;
    while((cm=chkRe.exec(text))!==null){
      skillStatus[layer+'-'+cm[2].trim()]=cm[1].toLowerCase()==='x'?'done':'pending';
    }
  }
}
function parseRosaSection(text,sections,letter){
  if(text.includes('|')&&!text.match(/^-\s+[\w\u4e00-\u9fff]+:\s/m)){
    for(const line of text.split('\n')){
      const t=line.trim();
      if(t.startsWith('|')&&!t.includes('---')){
        const cells=t.split('|').map(c=>c.trim()).filter(Boolean);
        if(cells.length>=1&&cells[0].toLowerCase()!=='key'){
          sections[letter].push({key:cells[0],label:cells.slice(2).join(' · ')||cells[0],type:cells[1]||'',source:letter==='O'?cells[2]:undefined,range:letter==='S'?cells[2]:undefined,effect:letter==='A'?cells[2]:undefined});
        }
      }
    }
    return;
  }
  const lines=text.split('\n');
  let cur=null;
  for(const raw of lines){
    const t=raw.trim();
    if(!t)continue;
    const itemM=t.match(/^-\s+([\w\u4e00-\u9fff]+):\s+(.*)/);
    if(itemM){
      if(cur)sections[letter].push(cur);
      cur={key:itemM[1],label:itemM[2]||itemM[1]};
      continue;
    }
    if(cur){
      const propM=t.match(/^([\w\u4e00-\u9fff]+):\s+(.*)/);
      if(propM){
        const pk=propM[1],pv=propM[2];
        const allowed=(PROP_KEYS[letter]||[]).concat(COMMON_PROP_KEYS);
        if(allowed.includes(pk)){
          if(pk==='weight'){cur.weight=parseFloat(pv)||0;}
          else if(letter==='R'){cur[pk]=pv;}
          else if(letter==='O'){
            if(pk==='type')cur.type=pv;
            else if(pk==='source')cur.source=pv;
            else cur[pk]=pv;
          }else if(letter==='S'){
            if(pk==='type')cur.type=pv;
            else if(pk==='range')cur.range=pv;
            else cur[pk]=pv;
          }else if(letter==='A'){
            if(pk==='type')cur.type=pv;
            else if(pk==='effect')cur.effect=pv;
            else if(pk==='precondition')cur.precondition=pv;
            else cur[pk]=pv;
          }else{
            cur[pk]=pv;
          }
        }else{
          // Inline sub-field (就地展开): same shape as actor.fields {key,type}
          if(!cur.subfields)cur.subfields=[];
          cur.subfields.push({key:pk,type:pv});
        }
      }
    }
  }
  if(cur)sections[letter].push(cur);
}
function parseActorsSection(text,sections){
  const re=/^###\s+(\S+)\s*$/gm;const found=[];let m;
  while((m=re.exec(text))!==null)found.push({id:m[1],start:m.index+m[0].length});
  // Sub-attributes that may appear indented under a "- key: type" field line,
  // captured onto the field instead of being dropped. `note` is sourced from
  // trailing `# ...` comments.
  const SUB_PROPS=['default','min','max','range','unit','label','desc','note'];
  for(let i=0;i<found.length;i++){
    const end=i+1<found.length?found[i+1].start-1:text.length;
    const fields=[];
    let example=null;
    let cur=null;
    for(const line of text.slice(found[i].start,end).split('\n')){
      const t=line.trim();
      // Detect actor-level example: "- example: path/to/file"
      if(t.startsWith('- example:')||t.startsWith('- example :')){
        const ci=t.indexOf(':');
        example=t.slice(ci+1).trim();
        continue;
      }
      // field line: "- key: type"
      const itemM=t.match(/^-\s+([\w\u4e00-\u9fff]+):\s*(.*)/);
      if(itemM){
        if(cur)fields.push(cur);
        cur={key:itemM[1],type:itemM[2]||''};
        continue;
      }
      if(cur){
        // indented sub-attribute: "default: 9" / "min: 100" / "max: 200" ...
        const propM=t.match(/^([\w\u4e00-\u9fff]+):\s*(.*)/);
        if(propM&&SUB_PROPS.includes(propM[1])){ cur[propM[1]]=propM[2]; continue; }
        // trailing comment: "# ..." → fold onto field note
        const cmtM=t.match(/^#\s*(.*)/);
        if(cmtM&&cmtM[1]){ cur.note=(cur.note?cur.note+' ':'')+cmtM[1]; continue; }
      }
    }
    if(cur)fields.push(cur);
    const actor={id:found[i].id,fields};
    if(example)actor.example=example;
    sections.actors.push(actor);
  }
}
// 准常量 spec (default/min/max/unit) as expandable sub-rows — one row per PRESENT
// key, styled like expanded sub-fields. Returns '' when none present (so nodes
// without specs render nothing and aren't expandable on specs alone).
function specRowsHtml(f){
  const rows=[];
  if(f.default!=null)rows.push(['default',f.default]);
  if(f.min!=null)rows.push(['min',f.min]);
  if(f.max!=null)rows.push(['max',f.max]);
  if(f.unit!=null&&f.unit)rows.push(['unit',f.unit]);
  if(!rows.length)return'';
  const tip=f.note||'';
  const tipAttr=tip?` data-tip="${esc(tip)}"`:'';
  return `<div${tipAttr} style="margin-left:16px;${tip?'cursor:help':''}">${rows.map(([k,v])=>`<div class="tnode" style="opacity:.85"><span class="tk" style="color:#2563eb;font-weight:600">${esc(k)}</span><span class="tt">${esc(String(v))}</span></div>`).join('')}</div>`;
}
function hasSpec(f){return f.default!=null||f.min!=null||f.max!=null||(f.unit!=null&&!!f.unit);}

// Reusable expandable structure tree for a single ROSA field key. Mirrors the
// ROSA column's field tree (inline subfields + centralized actor fallback from
// `## 对象` +准常量 specs), but static (no nested toggle) for compact inline
// reveal — e.g. inside PCDATR/Agent skill in/out chips. Returns '' if the key
// has no expandable structure (scalar with no specs).
function fieldTreeHtml(key,actorMap){
  const all=[...(state.R||[]),...(state.O||[]),...(state.S||[]),...(state.A||[])];
  const f=all.find(x=>x.key===key);
  if(!f)return '';
  const baseType=(f.type||'').replace(/\?$/,'').replace(/^Array</,'').replace(/>$/,'');
  const actor=actorMap[baseType];
  let subFields=(f.subfields||[]).filter(x=>x.key!=='example'&&x.key!=='desc').map(x=>({...x}));
  if(actor){
    const afMap={};for(const af of (actor.fields||[]))afMap[af.key]=af;
    for(const sf of subFields){
      const af=afMap[sf.key];
      if(!af)continue;
      if(sf.default==null&&af.default!=null)sf.default=af.default;
      if(sf.min==null&&af.min!=null)sf.min=af.min;
      if(sf.max==null&&af.max!=null)sf.max=af.max;
      if(!sf.unit&&af.unit)sf.unit=af.unit;
    }
    const have=new Set(subFields.map(x=>x.key));
    for(const af of (actor.fields||[])){
      if(af.key==='example'||af.key==='desc'||have.has(af.key))continue;
      subFields.push(af);have.add(af.key);
    }
  }
  const fldSpec=hasSpec(f);
  if(subFields.length===0&&!fldSpec)return '';
  let h='<div class="tree" style="margin:2px 0 6px 22px">';
  for(const af of subFields){
    const st=(af.type||'').replace(/\?$/,'').replace(/^Array</,'').replace(/>$/,'');
    const isRef=!!actorMap[st];
    h+=`<div class="tnode"><span class="tk">${esc(af.key)}</span><span class="tt${isRef?' ref':''}">${esc(splitOpt(af.type).name)}</span>${splitOpt(af.type).opt?'<span class="tt-opt" title="可选/可空">可选</span>':''}</div>`;
    h+=specRowsHtml(af);
    // 2nd level: centralized actor types only (e.g. 末端: Array<末端压力>)
    if(isRef&&actorMap[st]?.fields){
      h+=`<div style="margin-left:16px">`;
      for(const nf of actorMap[st].fields){
        if(nf.key==='example'||nf.key==='desc')continue;
        h+=`<div class="tnode"><span class="tk">${esc(nf.key)}</span><span class="tt">${esc(splitOpt(nf.type).name)}</span>${splitOpt(nf.type).opt?'<span class="tt-opt" title="可选/可空">可选</span>':''}</div>`;
        h+=specRowsHtml(nf);
      }
      h+='</div>';
    }
  }
  if(fldSpec)h+=specRowsHtml(f);
  h+='</div>';
  return h;
}

// Render a skill's in/out list. A chip referencing a field with expandable
// structure is click-to-expand (toggles a tree beneath the chip); chips without
// structure fall back to a hover tooltip. The toggle id is shared across the
// PCDATR and Agent tabs (same skill → same field), so opening a chip in one
// tab keeps it open in the other.
function ioListHtml(sk,l,si,io){
  const keys=sk[io]||[];
  if(!keys.length)return '';
  const actorMap={};for(const a of (state.actors||[]))actorMap[a.id]=a;
  // Interleave each chip with its own tree (when open) so the tree sits right
  // beneath the chip that owns it — not dumped after the whole chip list.
  let body='';
  keys.forEach((k,i)=>{
    const id=`sio-${l}-${si}-${io}-${i}`;
    const op=openSet.has(id);
    const tree=fieldTreeHtml(k,actorMap);
    // Expandable chips: onclick toggles AND data-tip shows full text on hover
    // (chip names truncate in compact views). Non-expandable: data-tip only.
    // Tree lives INSIDE the chip so an expanded chip stays a self-contained
    // horizontal card (header + tree beneath, at card width), same as a ROSA
    // field pill — it grows taller, not wider.
    const tip=` data-tip="${esc(fieldTip(k,state.actors))}"`;
    const attr=tree?`onclick="tog('${id}')"${tip}`:tip;
    body+=`<div class="sk-k${tree?' sk-k-exp':''}${op?' open':''}" ${attr}><div class="sk-k-hd"><span class="rg-fidx">${i+1}</span><span class="sk-k-key">${esc(k)}</span>${tree?`<span class="sk-k-arr">${op?'▾':'▸'}</span>`:''}</div>`;
    if(op&&tree)body+=`<div class="sk-io-tree">${tree}</div>`;
    body+=`</div>`;
  });
  return `<div class="sk-io"><span class="sk-iol">${io}</span>${body}</div>`;
}

// Collect every expandable in/out chip id (sio-*) across all skills. A chip is
// expandable iff fieldTreeHtml is non-empty (has inline sub-fields, an actor
// struct, or spec rows). Non-expandable ids are excluded so the toggle-state
// check (ids.every(open)) stays correct — non-expandable chips never enter
// openSet (clicking them is a no-op tooltip), so including them would force the
// button to always read "全部展开". Used by the Agent-tab 全部展开 button so it
// opens every skill card AND every in/out chip tree, not just the cards.
function sioIds(){
  if(!state||!state.agents)return [];
  const actorMap={};for(const a of (state.actors||[]))actorMap[a.id]=a;
  const ids=[];
  for(const l of ['P','C','D','A','T','R']){
    const sks=state.agents[l]||[];
    sks.forEach((sk,si)=>{
      for(const io of ['in','out']){
        (sk[io]||[]).forEach((k,i)=>{
          if(fieldTreeHtml(k,actorMap))ids.push(`sio-${l}-${si}-${io}-${i}`);
        });
      }
    });
  }
  return ids;
}

function parseTaskMd(text){
  const fm=parseFrontMatter(text);
  const bodyStart=text.indexOf('---',4);
  const body=bodyStart>0?text.slice(text.indexOf('\n',bodyStart)+1):text;
  const sections=parseMdSections(body);
  const meta={id:fm.id||'',title:fm.title||'',version:fm.version||'0.1',created:fm.created||new Date().toISOString().slice(0,10),parent:fm.parent||'',parent_layer:(fm.parent_layer||'').toUpperCase()};
  // Auto-generate agents from O/S/A/R if not already defined. `agentsAuto` flags
  // that the PCDATR pipeline is DERIVED (no hand-written ## 解空间) — used by the
  // renderer to unwrap generic derived cards into bare in/out parameter flow
  // (a goal title + checkbox on a derived card is noise; the data lineage is
  // the only useful content).
  const agentsAuto=!sections.agents||!Object.keys(sections.agents).length;
  const agents=agentsAuto?autoGenAgents(sections):sections.agents;
  return{meta,...sections,agents,agentsAuto};
}

/* Parse ## 解空间 section into PCDATR skills */
function parsePcdatrSkills(text){
  const agents={};
  // Find layer headers: ### P（感知） or ### P
  const layerRe=/^###\s*([PCDATRpcdatr])\s*[（(—\-\s]?\s*/gm;
  const layers=[];let lm;
  while((lm=layerRe.exec(text))!==null){
    const layerEnd=text.indexOf('\n### ',lm.index+1);
    layers.push({layer:lm[1].toUpperCase(),start:lm.index+lm[0].length,end:layerEnd>0?layerEnd:text.length});
  }
  for(const l of layers){
    const lText=text.slice(l.start,l.end);
    // Find skill definitions: #### P1 · skill_id [x] or #### P1 · skill_id
    const skRe=/^####\s*([PCDATRpcdatr]\d*)\s*[·.]*\s*(.+?)(?:\s*\[([ xX])\])?\s*$/gm;
    const skills=[];let sm;
    while((sm=skRe.exec(lText))!==null){
      const skStart=sm.index+sm[0].length;
      const skEnd=lText.indexOf('\n#### ',skStart);
      const skText=lText.slice(skStart,skEnd>0?skEnd:lText.length);
      const sk={id:sm[2].trim(),title:l.layer+'层技能',goal:'',status:sm[3]&&sm[3].toLowerCase()==='x'?'done':'pending',in:[],out:[]};
      // Parse goal from blockquote
      const goalM=skText.match(/^>\s*(?:goal[:：]\s*)?(.+)$/m);
      if(goalM)sk.goal=goalM[1].trim();
      // Parse in/out
      const inM=skText.match(/^-?\s*in:\s*(.+)$/m);
      if(inM){
        const v=inM[1].trim();
        if(v==='(无)'||v==='无'||v==='none')sk.in=[];
        else sk.in=v.split(/[,，]\s*/).map(s=>s.trim()).filter(Boolean);
      }
      const outM=skText.match(/^-?\s*out:\s*(.+)$/m);
      if(outM){
        const v=outM[1].trim();
        if(v==='(无)'||v==='无'||v==='none')sk.out=[];
        else sk.out=v.split(/[,，]\s*/).map(s=>s.trim()).filter(Boolean);
      }
      skills.push(sk);
    }
    if(skills.length)agents[l.layer]=skills;
  }
  return agents;
}

/* Auto-generate default PCDATR agents from rosa fields */
function autoGenAgents(sections){
  const oKeys=(sections.O||[]).map(f=>f.key);
  const sKeys=(sections.S||[]).map(f=>f.key);
  const aKeys=(sections.A||[]).map(f=>f.key);
  const rKeys=(sections.R||[]).map(f=>f.key);
  const ag={};
  // Default skill ids mirror the PCDATR layer names (aop.md convention)
  if(oKeys.length)ag.P=[{id:'perception',title:'感知',goal:'采集所有观察数据',status:'pending',in:[],out:oKeys}];
  if(sKeys.length)ag.C=[{id:'cognition',title:'认知',goal:'从观察推断状态',status:'pending',in:oKeys,out:sKeys}];
  if(aKeys.length){
    const dActKeys=aKeys;
    ag.D=[{id:'decision',title:'决策',goal:'根据状态选择动作',status:'pending',in:sKeys,out:dActKeys}];
    ag.A=[{id:'action',title:'执行',goal:'执行决策动作',status:'pending',in:dActKeys,out:[]}];
  }
  if(rKeys.length)ag.R=[{id:'reward',title:'评价',goal:'评估任务质量',status:'pending',in:sKeys,out:rKeys}];
  return ag;
}

/* YAML scalar/inline value coercion helpers (mirrored in aop-server.mjs). */
function stripYamlComment(v){let d=0,q=null;for(let i=0;i<v.length;i++){const c=v[i];if(q){if(c===q)q=null;continue;}if(c==='"'||c==="'")q=c;else if(c==='{'||c==='[')d++;else if(c==='}'||c===']')d--;else if(c==='#'&&d===0&&i>0&&/\s/.test(v[i-1]))return v.slice(0,i);}return v;}
/* Split "value # comment" → {val, cmt}: val = comment-stripped part (untrimmed),
   cmt = trailing comment text sans leading #. Preserves a frame label's inline
   comment through parse→serialize round-trips (field-value comments still lost on
   section rebuild — pending incremental-write refactor). */
function splitYamlComment(v){v=String(v==null?'':v);const val=stripYamlComment(v);if(val.length>=v.length)return{val,cmt:''};const cmt=v.slice(val.length).replace(/^[\s#]+/,'').replace(/[\r\n]/g,' ').trim();return{val,cmt};}
/* Coerce a YAML scalar/inline value. Empty→'' (NOT {}); '{}'→{}; 'null'→null;
   {...}/[...] → parsed object/array; quoted scalar → unquoted string (inner text
   verbatim); bare integer w/o leading zeros → number; floats / leading-zero /
   scientific numerics → string (preserves significant digits like 0.70, 007, 1.0). */
function coerceDsVal(v){if(v===null||v===undefined)return '';v=stripYamlComment(String(v)).trim();if(v==='{}')return {};if(v==='')return '';if(v==='null')return null;if(v.startsWith('{')){try{return JSON.parse(v);}catch{return v;}}if(v.startsWith('[')){try{return JSON.parse(v);}catch{return v;}}if(v.length>=2&&((v[0]==='"'&&v[v.length-1]==='"')||(v[0]==="'"&&v[v.length-1]==="'")))return v.slice(1,-1);if(/^-?(0|[1-9]\d*)$/.test(v))return Number(v);return v;}

/* Parse a `trajectory:` block-YAML body into ordered frames [{label,o,s,a,r}].
   Each `- ` opens a frame; `o:/s:/a:/r:` at indent>=2 set that letter (scalar or
   inline map); deeper-indented `key: val` lines fill the letter's map. Returns
   null when no trajectory block is present. */
function parseTrajectoryBlock(text){
  const lines=text.split('\n');
  let s=-1;
  for(let i=0;i<lines.length;i++){if(/^\s*trajectory\s*:\s*$/.test(lines[i])){s=i+1;break;}}
  if(s<0)return null;
  const steps=[];let cur=null,cl=null;
  for(let i=s;i<lines.length;i++){
    const line=lines[i];
    if(!line.trim())continue;
    if(/^#{2,4}\s/.test(line))break;
    if(line.trim().startsWith('#'))continue;
    const ind=line.length-line.trimStart().length;
    const t=line.trim();
    if(/^-\s/.test(t)||t==='-'){
      cur={label:'',o:{},s:{},a:{},r:{}};
      steps.push(cur);cl=null;
      const a=t.replace(/^-\s*/,'');
      const ci=a.indexOf(':');
      if(ci>0){const k=a.slice(0,ci).trim();const raw=a.slice(ci+1);if(k==='label'){const sc=splitYamlComment(raw);cur.label=coerceDsVal(sc.val);if(sc.cmt)cur._lc=sc.cmt;}else if('osar'.includes(k))cur[k]=raw.trim()===''?{}:coerceDsVal(raw);}
      continue;
    }
    const lm=t.match(/^([osar])\s*:\s*(.*)$/);
    if(lm&&ind>=2){
      cl=lm[1];const raw=lm[2];
      if(raw.trim()!==''){cur[cl]=coerceDsVal(raw);cl=null;}
      continue;
    }
    if(cl&&cur){const ci=t.indexOf(':');if(ci>0)cur[cl][t.slice(0,ci).trim()]=coerceDsVal(t.slice(ci+1));}
  }
  return steps;
}

/* Parse ## Datasets section. Each `### ` entry is a sample; its body is either a
   `trajectory:` block (multi-frame episode) or legacy `#### o/s/a/r` subsections
   (degenerate single-frame). Normalized to {id,label,scenario,steps:[{label,o,s,a,r}]}. */
function parseDatasetsSection(text){
  const datasets=[];
  const dsRe=/^###[ \t]+#?(\d*)[ \t]*[·.]*[ \t]*(.+?)$/gm;
  const found=[];let m;
  while((m=dsRe.exec(text))!==null)found.push({num:m[1],label:m[2].trim(),start:m.index+m[0].length,headingIdx:m.index});
  for(let i=0;i<found.length;i++){
    const end=i+1<found.length?found[i+1].headingIdx:text.length;
    const dsText=text.slice(found[i].start,end);
    const ds={id:found[i].num||String(i+1),label:found[i].label,scenario:'',steps:[{label:'',o:{},s:{},a:{},r:{}}]};
    const scMatch=dsText.match(/^[>\s]*(?:scenario[:：]\s*)(.+)$/m);
    if(scMatch)ds.scenario=scMatch[1].trim();
    const trj=parseTrajectoryBlock(dsText);
    if(trj&&trj.length){ds.steps=trj;}
    else{
      // legacy #### o/s/a/r → single frame
      const subRe=/^####\s*([osar])\s*$/gim;
      const subs=[];let sm;
      while((sm=subRe.exec(dsText))!==null)subs.push({letter:sm[1].toLowerCase(),start:sm.index+sm[0].length,headingIdx:sm.index});
      for(let j=0;j<subs.length;j++){
        const sEnd=j+1<subs.length?subs[j+1].headingIdx:dsText.length;
        const sText=dsText.slice(subs[j].start,sEnd);
        for(const line of sText.split('\n')){
          const t=line.trim();
          if(!t.startsWith('- '))continue;
          const content=t.slice(2).trim();
          const ci=content.indexOf(':');
          if(ci<=0)continue;
          const k=content.slice(0,ci).trim();
          const v=coerceDsVal(content.slice(ci+1).trim());
          ds.steps[0][subs[j].letter][k]=v;
        }
      }
    }
    datasets.push(ds);
  }
  return datasets;
}

/* Parse ## 子任务 section (分形递归). Each `### ` entry is a subtask attached to a
 * PCDATR layer; `layer` may come from an explicit `layer:` field or be parsed
 * from the heading (e.g. "### P · 用气感知"). Blueprint: parseDatasetsSection. */
function parseSubtasksSection(text){
  const subs=[];
  const hRe=/^###\s+(.+?)\s*$/gm;
  const found=[];let m;
  while((m=hRe.exec(text))!==null)found.push({head:m[1].trim(),start:m.index+m[0].length,headingIdx:m.index});
  const parseList=v=>(!v||v==='(无)'||v==='无'||v==='none')?[]:v.split(/[,，]\s*/).map(s=>s.trim()).filter(Boolean);
  for(let i=0;i<found.length;i++){
    const end=i+1<found.length?found[i+1].headingIdx:text.length;
    const body=text.slice(found[i].start,end);
    const get=re=>{const x=body.match(re);return x?x[1].trim():'';};
    let layer=get(/^layer:\s*(.+)$/m);
    let title=found[i].head;
    // Heading form "### P · 用气感知" or "### P - 用气感知" → layer + title
    const hm=title.match(/^([PCDATRpcdatr])\s*[·\-—:：]?\s*(.*)$/);
    if(hm){if(!layer)layer=hm[1].toUpperCase();title=(hm[2]||'').trim()||title;}
    const task=get(/^task:\s*(.+)$/m);
    const goal=get(/^goal:\s*(.+)$/m);
    const subReward=get(/^sub_reward:\s*(.+)$/m);
    const inM=body.match(/^-?\s*in:\s*(.+)$/m);
    const outM=body.match(/^-?\s*out:\s*(.+)$/m);
    subs.push({title:(title||task)||'',layer:(layer||'').toUpperCase(),task:task||'',goal:goal||'',sub_reward:subReward||'',in:parseList(inM?inM[1]:''),out:parseList(outM?outM[1]:'')});
  }
  return subs;
}

/* ========== V1→V2 ========== */
function cv1(d){
  const sk=d.skills||[],oM=new Map,sM=new Map,aM=new Map,rA=[];
  for(const s of sk){const m=s.mdp||{};
    (m.O||[]).forEach(f=>oM.set(f.key,{...f,_l:s.layer}));
    (m.S||[]).forEach(f=>sM.set(f.key,f));
    (m.A||[]).forEach(f=>aM.set(f.key,{...f,_l:s.layer}));
    (m.R||[]).forEach(f=>rA.push(f));
  }
  const dActKeys=[...aM.entries()].filter(([,v])=>v._l==='D').map(([k])=>k);
  const ag={};
  for(const s of sk){const m=s.mdp||{};const l=s.layer;if(!ag[l])ag[l]=[];
    let inp=[],out=[];
    if(l==='P'){out=(m.O||[]).map(f=>f.key);}
    else if(l==='C'){inp=[...oM.keys()];out=(m.S||[]).map(f=>f.key);}
    else if(l==='D'){inp=[...sM.keys()];out=(m.A||[]).map(f=>f.key);}
    else if(l==='A'){inp=dActKeys;out=[];}
    else if(l==='T'){inp=[...sM.keys(),...dActKeys];out=[];}
    else if(l==='R'){inp=[...sM.keys()];out=(m.R||[]).map(f=>f.key);}
    ag[l].push({id:s.id,title:s.title||'',goal:s.goal||'',status:s.status||'pending',in:inp,out:out});
    if(s.status)skillStatus[l+'-'+s.id]=s.status;
  }
  return{meta:d.meta||{id:'',title:'',version:'0.1'},actors:d.actors||[],R:rA,O:[...oM.values()],S:[...sM.values()],A:[...aM.values()],datasets:d.datasets||[],agents:ag,agentsAuto:false};
}
function merge(a){const m=new Map;(a||[]).forEach(f=>m.set(f.key,f));return[...m.values()];}

/* ========== Constants ========== */
const ROSA={r:{label:'评价',color:'var(--cr)'},o:{label:'观察',color:'var(--co)'},s:{label:'状态',color:'var(--cs)'},a:{label:'动作',color:'var(--cx)'}};
const LAYERS={P:{label:'感知',color:'var(--co)'},C:{label:'认知',color:'var(--cs)'},D:{label:'决策',color:'var(--cx)'},A:{label:'执行',color:'#64748b'},T:{label:'转变',color:'#64748b'},R:{label:'评价',color:'var(--cr)'}};
// PCDATR layer → rosa letter mapping for dataset conversion
const L2R={P:'o',C:'s',D:'a',A:'a',R:'r'};
// Property whitelist: a `key: value` line under a field whose key is in this
// list is treated as field metadata; otherwise it is treated as an inline
// sub-field (就地展开). Lets structured types be defined inline under O/S/A/R
// fields without needing a centralized `## 对象` block.
const PROP_KEYS={
  R:['formula','unit','threshold','weight'],
  S:['type','range'],
  O:['type','source'],
  A:['type','effect','precondition'],
};
const COMMON_PROP_KEYS=['example','desc','label','default','min','max','unit'];

// Does a rosa field have an expandable sub-field tree?
// Inline sub-fields (f.subfields) take precedence; otherwise fall back to a
// centralized actor definition in actorMap (backward compat with `## 对象`).
function fieldHasTree(f,actorMap,letter){
  if(letter==='r')return !!(f.formula||f.unit||f.threshold||(f.subfields||[]).length);
  if((f.subfields||[]).filter(x=>x.key!=='example').length)return true;
  if(hasSpec(f))return true;
  const baseType=(f.type||'').replace(/\?$/,'').replace(/^Array</,'').replace(/>$/,'');
  const a=actorMap[baseType];
  return !!(a&&(a.fields||[]).filter(x=>x.key!=='example').length);
}
// Collect fld-<letter>-<idx> IDs for every field in a column that has a tree.
function colFieldIds(letter,items,actorMap){
  const ids=[];
  for(let fi=0;fi<items.length;fi++)if(fieldHasTree(items[fi],actorMap,letter))ids.push('fld-'+letter+'-'+fi);
  return ids;
}

// Build tooltip text for a rosa field key
function fieldTip(key,actors){
  if(!state)return'';
  const all=[...state.R||[],...state.O||[],...state.S||[],...state.A||[]];
  const f=all.find(x=>x.key===key);
  if(!f)return'';
  let tip=f.label||f.key;
  if(f.type)tip+='\ntype: '+f.type;
  if(f.source)tip+='\nsource: '+f.source;
  if(f.range)tip+='\nrange: '+f.range;
  if(f.effect)tip+='\neffect: '+f.effect;
  if(f.formula)tip+='\nformula: '+f.formula;
  if(f.unit)tip+='\nunit: '+f.unit;
  if(f.threshold)tip+='\nthreshold: '+f.threshold;
  if(f.weight!=null)tip+='\nweight: '+Math.round(f.weight*100)+'%';
  if(f.default!=null)tip+='\ndefault: '+f.default;
  if(f.min!=null||f.max!=null)tip+='\nrange: '+(f.min!=null?f.min:'-')+' ~ '+(f.max!=null?f.max:'-');
  if(f.desc)tip+='\n'+f.desc.replace(/\n/g,' ');
  if(f.example)tip+='\n📷 '+f.example;
  // Expand structured type — inline sub-fields first, then centralized actor
  const baseType=(f.type||'').replace(/\?$/,'').replace(/^Array</,'').replace(/>$/,'');
  const inlineFields=(f.subfields||[]).filter(x=>x.key!=='example');
  const actor=(actors||[]).find(a=>a.id===baseType);
  const tipFields=inlineFields.length?inlineFields:((actor&&actor.fields)||[]).filter(x=>x.key!=='example');
  if(tipFields.length){
    tip+='\n──────────';
    for(const af of tipFields)tip+='\n  '+af.key+': '+af.type;
  }
  // actor-level example only when using the fallback path; inline example is
  // already surfaced via f.example above (line reading f.example)
  if(!inlineFields.length&&actor&&actor.example)tip+='\n📷 '+actor.example;
  return tip;
}

/* ========== Media helpers ========== */
const IMG_EXT=/\.(png|jpg|jpeg|gif|webp|svg|bmp)$/i;
const VID_EXT=/\.(mp4|webm|ogg|mov)$/i;
const AUD_EXT=/\.(mp3|wav|ogg|m4a|aac|flac)$/i;
function isImg(v){return typeof v==='string'&&IMG_EXT.test(v)}
function isVid(v){return typeof v==='string'&&VID_EXT.test(v)}
function isAud(v){return typeof v==='string'&&AUD_EXT.test(v)}
function isMedia(v){return typeof v==='string'&&(IMG_EXT.test(v)||VID_EXT.test(v)||AUD_EXT.test(v)||/^https?:\/\/.+\.(png|jpg|jpeg|gif|webp|svg|bmp|mp4|webm|ogg|mov|mp3|wav|m4a)/i.test(v))}
/* Lightbox */
function openLb(src,type){
  const lb=$('lb'),c=$('lbContent');
  if(type==='img')c.innerHTML=`<img src="${esc(src)}">`;
  else if(type==='vid')c.innerHTML=`<video src="${esc(src)}" controls autoplay></video>`;
  else if(type==='aud')c.innerHTML=`<audio src="${esc(src)}" controls autoplay></audio>`;
  lb.classList.add('show');
}
function closeLb(){
  const lb=$('lb'),c=$('lbContent');
  lb.classList.remove('show');
  c.innerHTML='';
}

/* Resolve relative media paths with currentTask prefix */
function mediaSrc(v){
  if(!v||typeof v!=='string')return v;
  if(v.startsWith('http://')||v.startsWith('https://')||v.startsWith('/'))return v;
  if(currentTask)return currentTask+'/'+v;
  return v;
}

/* Parse a dataset value that may be an inline object/array literal written as a
   string (task.md uses both quoted JSON and bare-key JS-ish objects). Returns
   the original value unchanged if it isn't a parseable container. */
function tryParseVal(v){
  if(typeof v==='object'&&v!==null) return v;
  if(typeof v!=='string') return v;
  const t=v.trim();
  if(!(t.startsWith('{')||t.startsWith('['))) return v;
  try{ return JSON.parse(t); }catch(e){}
  try{
    const s=t.replace(/\.\.\./g,'"…"')
             .replace(/([{,]\s*)([A-Za-z_$][\w$]*)\s*:/g,'$1"$2":')
             .replace(/'([^']*)'/g,'"$1"')
             .replace(/,\s*([}\]])/g,'$1');
    return JSON.parse(s);
  }catch(e2){}
  return v;
}

/* Render a dataset value: scalars inline; objects/arrays as a collapsible tree
   (default collapsed, tog by id) — consistent with the rosa field trees above. */
function renderDsVal(v,id){
  if(typeof v!=='object'||v===null) return `<span class="rg-v">${esc(String(v))}</span>`;
  const isArr=Array.isArray(v);
  const entries=isArr?v.map((x,i)=>[i,x]):Object.entries(v);
  if(!entries.length) return `<span class="rg-v">${isArr?'[]':'{}'}</span>`;
  const summary=isArr?`[${entries.length}]`:`{${entries.length}}`;
  const open=openSet.has(id);
  let h=`<span class="fld-arr${open?' open':''}" onclick="tog('${id}')">▸</span>`;
  h+=`<span class="rg-v" onclick="tog('${id}')" style="cursor:pointer;color:var(--t3)">${summary}</span>`;
  if(open){
    // Responsive grid: wide → many columns of compact cells; narrow → single
    // tidy column. Beats a flex pill-wrap, which collapses to one-per-line
    // whenever long mono keys exceed the (narrow) group column width.
    // Nested objects / media span the full grid width.
    h+=`<div class="tree" style="margin:2px 0 4px 0;width:100%;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 8px;align-items:baseline">`;
    for(const[kk,val] of entries){
      const childObj=typeof val==='object'&&val!==null;
      const childId=id+'-'+kk;
      const lbl=`<span style="color:#7c3aed">${esc(String(kk))}</span><span style="color:var(--t3)">: </span>`;
      if(childObj){
        h+=`<div style="grid-column:1/-1;min-width:0"><span class="tk">${esc(String(kk))}</span>`;
        h+=renderDsVal(val,childId);
        h+=`</div>`;
      }else if(isImg(val)){
        const ms=mediaSrc(val);
        h+=`<div style="grid-column:1/-1;min-width:0"><span class="tk">${esc(String(kk))}</span><span class="tv" style="display:block;margin-top:4px"><img src="${esc(ms)}" loading="lazy" style="max-height:200px;max-width:100%;border-radius:6px;background:#f8fafc;cursor:pointer" onclick="openLb('${esc(ms)}','img')" onerror="this.style.display='none'"></span></div>`;
      }else if(isVid(val)){
        const ms=mediaSrc(val);
        h+=`<div style="grid-column:1/-1;min-width:0"><span class="tk">${esc(String(kk))}</span><span class="tv" style="display:block;margin-top:4px"><video src="${esc(ms)}" controls preload="metadata" style="max-height:200px;max-width:100%;border-radius:6px"></video></span></div>`;
      }else if(isAud(val)){
        const ms=mediaSrc(val);
        h+=`<div style="grid-column:1/-1;min-width:0"><span class="tk">${esc(String(kk))}</span><span class="tv" style="display:block;margin-top:4px"><audio src="${esc(ms)}" controls></audio></span></div>`;
      }else{
        h+=`<span style="font-family:var(--mono);font-size:12px;background:#f1f5f9;border:1px solid var(--bd);border-radius:5px;padding:1px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0">${lbl}<span style="color:var(--t2);font-weight:600">${esc(String(val))}</span></span>`;
      }
    }
    h+=`</div>`;
  }
  return h;
}

/* Collect all tog ids for a dataset list: each sample card (sp-i) plus every
   nested value tree node (dv-...) recursively — mirrors renderDsVal's id scheme. */
function collectDsIds(datasets){
  const ids=[];
  const walk=(v,id)=>{
    if(typeof v!=='object'||v===null)return;
    ids.push(id);
    const entries=Array.isArray(v)?v.map((x,i)=>[i,x]):Object.entries(v);
    for(const[kk,val]of entries)walk(val,id+'-'+kk);
  };
  for(let i=0;i<datasets.length;i++){
    ids.push('sp-'+i);
    const s=normalizeSample(datasets[i]);
    (s.steps||[]).forEach((st,si)=>{
      for(const letter of ['o','s','a','r']){
        const data=st[letter]||{};
        for(const[k,v]of Object.entries(data)){
          const pv=tryParseVal(v);
          if(typeof pv==='object'&&pv!==null)walk(pv,'dv-'+i+'-'+si+'-'+letter+'-'+k);
        }
      }
    });
  }
  return ids;
}

/* ===== Per-section + global expand-id collectors =====
 * The page now stacks three sections (Task / Agent / DataSet); each section
 * header has its own 展开/折叠, and the banner has a 全部展开 covering all.
 * IDs are the same cross-view toggle ids (fld-/at-/sio-/sp-/dv-) so expansion
 * state is identical whether collected per-section or globally.
 */
function taskExpandIds(data,actors){
  const am={};for(const a of (actors||[]))am[a.id]=a;
  const ids=[];
  for(const letter of ['r','o','s','a'])ids.push(...colFieldIds(letter,data[letter]||[],am));
  return ids;
}
function agentExpandIds(agents,auto){
  // Skills always show their in/out parameter list (no skill-level toggle); the
  // only toggleable level is each parameter's internal tree (sio-*). So the
  // 全部展开 button only needs those — opening every param tree in one click.
  return sioIds();
}
function dsExpandIds(datasets){return collectDsIds(datasets||[]);}
function allExpandIds(data,actors,agents,datasets,auto){
  return [...taskExpandIds(data,actors),...agentExpandIds(agents,auto),...dsExpandIds(datasets)];
}
// Render a section header bar (Task / Agent / DataSet) with a per-section
// expand/collapse button. `sid` (optional) anchors the section for the sticky
// nav jump buttons. Returns the opening <section> + header; caller appends
// content then a closing </section>.
function vsec(title,subtitle,ids,sid){
  const has=ids.length>0;
  const allOpen=has&&ids.every(id=>openSet.has(id));
  const btn=has?`<button class="btn mini" onclick="togIds([${ids.map(id=>`'${id}'`).join(',')}])">${allOpen?'全部折叠':'全部展开'}</button>`:'';
  return `<section class="vsec"${sid?` id="${sid}"`:''}><div class="vsec-hd"><h3>${esc(title)}</h3><span class="vsec-sub">${esc(subtitle)}</span><span class="spacer"></span>${btn}</div>`;
}
// Smooth-scroll to a section anchor (sticky-nav jump buttons).
function scrollSec(id){const el=document.getElementById(id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});}


/* Collect toggle ids of dataset value-trees (dv-*) whose object contains at
   least one media leaf — so samples with embedded images/videos/audio auto-
   expand (otherwise the media hides behind a collapsed `{n}` summary). */
function mediaTreeIds(datasets){
  const ids=[];
  const walk=(v,id)=>{
    if(typeof v!=='object'||v===null)return;
    let has=false;
    const entries=Array.isArray(v)?v.map((x,i)=>[i,x]):Object.entries(v);
    for(const[kk,val]of entries){
      if(typeof val==='string'&&(isImg(val)||isVid(val)||isAud(val)))has=true;
      walk(val,id+'-'+kk);
    }
    if(has)ids.push(id);
  };
  for(let i=0;i<(datasets||[]).length;i++){
    const s=normalizeSample(datasets[i]);
    (s.steps||[]).forEach((st,si)=>{
      for(const letter of ['o','s','a','r']){
        for(const[k,v]of Object.entries(st[letter]||{})){
          const pv=tryParseVal(v);
          if(typeof pv==='object'&&pv!==null)walk(pv,'dv-'+i+'-'+si+'-'+letter+'-'+k);
        }
      }
    });
  }
  return ids;
}

/* ========== Normalize dataset to rosa sample format ========== */
function normalizeSample(ds){
  if(ds.steps&&Array.isArray(ds.steps)){
    ds.steps.forEach(st=>{for(const l of ['o','s','a','r'])if(!st[l]||typeof st[l]!=='object')st[l]={};});
    return ds;
  }
  return {id:ds.id||ds.label||'',label:ds.label||ds.id||'',scenario:ds.scenario||'',
    steps:[{label:'',o:ds.o||{},s:ds.s||{},a:ds.a||{},r:ds.r||{}}]};
}

/* ========== Dataset edit mode ========== */
// 字段 key 集合：样本已有 key ∪ 该层问题空间定义的 schema key（让用户能填尚未填的字段）
function dsKeys(letter,data){
  const col={o:'O',s:'S',a:'A',r:'R'}[letter];
  const present=Object.keys(data||{});
  for(const f of (state[col]||[])){ if(!present.includes(f.key)) present.push(f.key); }
  return present;
}
function dsType(letter,key){
  const col={o:'O',s:'S',a:'A',r:'R'}[letter];
  return (state[col]||[]).find(f=>f.key===key)?.type||'';
}
// 判定某字段是否媒体（按 schema type 或当前值的扩展名）
function dsMediaKind(type,val){
  const t=(type||'').toLowerCase();
  if(/image|img|photo|picture|帧|图/.test(t))return'img';
  if(/video|vid|视频/.test(t))return'vid';
  if(/audio|sound|voice|音频|语音/.test(t))return'aud';
  if(typeof val==='string'){ if(isImg(val))return'img'; if(isVid(val))return'vid'; if(isAud(val))return'aud'; }
  return null;
}
// 编辑态：单字段一行（文本输入 / 媒体上传）。坐标含帧索引 si。
// 对象/数组值在输入框里以 JSON 文本呈现（避免 [object Object] 损坏），写回时由
// parseInputVal 反解析；标量原样。媒体字段按 schema type 或值扩展名判定。
function dsValToInput(v){if(v===null||v===undefined)return '';if(typeof v==='object')return JSON.stringify(v);return String(v);}
function parseInputVal(s){if(s==null)return '';const t=String(s).trim();if(t.startsWith('{')||t.startsWith('[')){try{return JSON.parse(t);}catch{return s;}}return coerceDsVal(t);}
function dsRow(i,si,letter,key,val){
  const kind=dsMediaKind(dsType(letter,key),val);
  const d=`data-i="${i}" data-si="${si}" data-letter="${letter}" data-key="${esc(key)}"`;
  const inp=`<input class="ds-input" value="${esc(dsValToInput(val))}" ${d} onchange="dsOnInput(this)" placeholder="${kind?'路径或URL':'值'}">`;
  const x=`<button class="btn ghost ds-x" ${d} onclick="dsOnDel(this)" title="删除该字段">×</button>`;
  if(!kind) return `<div class="ds-edit-row"><span class="rg-k">${esc(key)}</span>${inp}${x}</div>`;
  let thumb='';
  if(val){
    const ms=mediaSrc(val);
    if(kind==='img') thumb=`<img src="${esc(ms)}" class="ds-thumb" onerror="this.style.display='none'">`;
    else if(kind==='vid') thumb=`<video src="${esc(ms)}" class="ds-thumb" preload="metadata"></video>`;
    else thumb=`<span class="ds-aud">&#9835;</span>`;
  }
  const accept=kind==='img'?'image/*':kind==='vid'?'video/*':'audio/*';
  const label=kind==='img'?'选图片':kind==='vid'?'选视频':'选音频';
  const up=`<label class="btn ghost ds-up">${label}<input type="file" accept="${accept}" ${d} onchange="dsOnUpload(this)"></label>`;
  return `<div class="ds-edit-row"><span class="rg-k">${esc(key)}</span>${inp}${up}${thumb}${x}</div>`;
}
// 编辑态：单个轨迹帧（多帧时显示帧头 + 帧标签 + 删帧）
function dsEditableFrame(i,si,st,multi){
  let h='';
  if(multi){
    h+=`<div class="frame-hd" style="display:flex;align-items:center;gap:8px;margin:8px 0 4px;padding:6px 10px;background:var(--bg);border:1px solid var(--bd);border-radius:6px">`;
    h+=`<span style="font-weight:700;color:var(--t2)">帧 ${si+1}</span>`;
    h+=`<input class="ds-input" style="flex:1;min-width:0" value="${esc(st.label||'')}" data-i="${i}" data-si="${si}" onchange="dsOnStepLabel(this)" placeholder="帧标签（可空）">`;
    if(si>0)h+=`<span style="font-size:12px;color:var(--t3)">← 上一帧转移后果</span>`;
    h+=`<button class="btn ghost ds-x" data-i="${i}" data-si="${si}" onclick="dsOnDelFrame(this)" title="删除该帧">×</button>`;
    h+=`</div>`;
  }
  h+=`<div class="rosa-row">`;
  for(const letter of ['o','s','a','r']){
    const rm=ROSA[letter];
    const data=st[letter]||{};
    h+=`<div class="rosa-group"><div class="rg-hd" style="background:${rm.color}10;color:${rm.color}"><span style="font-weight:800;font-size:17px">${letter.toUpperCase()}</span> ${rm.label}</div><div class="rg-body">`;
    for(const key of dsKeys(letter,data)) h+=dsRow(i,si,letter,key,data[key]);
    h+=`<button class="btn ghost ds-add" data-i="${i}" data-si="${si}" data-letter="${letter}" onclick="dsOnAddField(this)">+ 字段</button>`;
    h+=`</div></div>`;
  }
  h+=`</div>`;
  return h;
}
// 编辑态：整张样本卡（名称/场景 + 多帧可编辑 + 添加帧）
function dsEditableCard(i,s){
  let h=`<div class="sample open">`;
  h+=`<div class="sample-hd" onclick="tog('sp-${i}')"><span class="chev">▾</span><span class="s-num">#${i+1}</span><span class="s-label">${esc(s.label||s.id||('样本'+(i+1)))}</span><span style="margin-left:auto;font-size:12px;color:var(--t3)">编辑中</span></div>`;
  h+=`<div class="sample-bd">`;
  h+=`<div class="ds-meta"><input class="ds-input ds-label-in" value="${esc(s.label||s.id||'')}" data-i="${i}" data-meta="label" onchange="dsOnMeta(this)" placeholder="样本名称（如：自检）"><input class="ds-input ds-scene-in" value="${esc(s.scenario||'')}" data-i="${i}" data-meta="scenario" onchange="dsOnMeta(this)" placeholder="场景描述"></div>`;
  const multi=(s.steps||[]).length>1;
  (s.steps||[]).forEach((st,si)=>{ h+=dsEditableFrame(i,si,st,multi); });
  h+=`<button class="btn ghost ds-add" data-i="${i}" onclick="dsOnAddFrame(this)" style="margin-top:6px">+ 添加帧</button>`;
  h+=`</div></div></div>`;
  return h;
}
// —— 写回 task.md：整段重建 ## Datasets（trajectory 块式 YAML），交给服务端 ——
function persistDataset(){
  if(!currentTask) return;
  const out=(state.datasets||[]).map(d=>{
    const s=normalizeSample(d);
    return {label:s.label||s.id||'',scenario:s.scenario||'',steps:(s.steps||[]).map(st=>({label:st.label||'',_lc:st._lc||'',o:st.o||{},s:st.s||{},a:st.a||{},r:st.r||{}}))};
  });
  fetch('/dataset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task:currentTask,datasets:out})}).catch(()=>{});
}
// —— 事件处理（靠 data-* 属性取坐标，避免 key 转义问题）——
function dsOnInput(el){ dsSetField(+el.dataset.i,+el.dataset.si,el.dataset.letter,el.dataset.key,el.value); }
function dsOnMeta(el){ dsSetMeta(+el.dataset.i,el.dataset.meta,el.value); }
function dsOnDel(el){ dsDelField(+el.dataset.i,+el.dataset.si,el.dataset.letter,el.dataset.key); }
function dsOnAddField(el){ dsAddField(+el.dataset.i,+el.dataset.si,el.dataset.letter); }
async function dsOnUpload(el){ const f=el.files&&el.files[0]; if(f) await dsUpload(+el.dataset.i,+el.dataset.si,el.dataset.letter,el.dataset.key,f); }
function dsOnStepLabel(el){ dsSetStepLabel(+el.dataset.i,+el.dataset.si,el.value); }
function dsOnAddFrame(el){ dsAddFrame(+el.dataset.i); }
function dsOnDelFrame(el){ dsDelFrame(+el.dataset.i,+el.dataset.si); }
// —— 状态变更 ——
function dsSetField(i,si,letter,key,val){
  const d=normalizeSample(state.datasets[i]); const st=d.steps[si]; st[letter]=st[letter]||{};
  const parsed=parseInputVal(val);
  if(parsed===''||parsed==null) delete st[letter][key]; else st[letter][key]=parsed;
  state.datasets[i]=d; persistDataset();
}
function dsSetMeta(i,field,val){
  const d=normalizeSample(state.datasets[i]); d[field]=val; state.datasets[i]=d; persistDataset();
}
function dsDelField(i,si,letter,key){
  const d=normalizeSample(state.datasets[i]); if(d.steps[si][letter]) delete d.steps[si][letter][key];
  state.datasets[i]=d; render(); persistDataset();
}
function dsAddField(i,si,letter){
  const raw=prompt('新增字段 key（英文标识，如 defect_img / v1.0）：');
  if(!raw) return;
  const k=raw.trim().replace(/[^\w一-龥.\-]/g,'_');
  if(!k) return;
  const d=normalizeSample(state.datasets[i]); const st=d.steps[si]; st[letter]=st[letter]||{};
  if(!(k in st[letter])) st[letter][k]='';
  state.datasets[i]=d; render(); persistDataset();
}
function dsSetStepLabel(i,si,val){
  const d=normalizeSample(state.datasets[i]); d.steps[si].label=val; state.datasets[i]=d; persistDataset();
}
function dsAddFrame(i){
  const d=normalizeSample(state.datasets[i]); d.steps.push({label:'',o:{},s:{},a:{},r:{}});
  state.datasets[i]=d; render(); persistDataset();
}
function dsDelFrame(i,si){
  const d=normalizeSample(state.datasets[i]);
  if(d.steps.length<=1){ alert('至少保留一帧'); return; }
  d.steps.splice(si,1); state.datasets[i]=d; render(); persistDataset();
}
function dsAddSample(){
  if(!currentTask) return;
  state.datasets.push({label:'新样本',scenario:'',steps:[{label:'',o:{},s:{},a:{},r:{}}]});
  openSet.add('sp-'+(state.datasets.length-1));
  if(!dsEdit) dsEdit=true;
  render(); persistDataset();
}
async function dsUpload(i,si,letter,key,file){
  if(!currentTask) return;
  try{
    const buf=await file.arrayBuffer();
    const r=await fetch('/upload?task='+encodeURIComponent(currentTask)+'&name='+encodeURIComponent(file.name),{method:'POST',body:buf});
    const j=await r.json().catch(()=>({}));
    if(j&&j.path){ dsSetField(i,si,letter,key,j.path); render(); }
    else alert('上传失败：'+(j?.error||('HTTP '+r.status)));
  }catch(e){ alert('上传失败：'+e.message); }
}
function dsToggleEdit(){
  if(!currentTask){ alert('请先用 /aop 创建任务（编辑保存需要服务端的 task.md）'); return; }
  dsEdit=!dsEdit; render();
}

/* ========== Render ========== */
function render(){
  if(!state){$('app').innerHTML='<div class="import-area" onclick="doImport()">点击导入 task.md / JSON 或拖放文件到页面</div>';return;}
  const{meta,actors,R,O,S,A,datasets}=state;
  let h='';

  // Banner
  h+=`<div class="banner">`;
  // Breadcrumb: task path (root → … → current leaf). Ancestor crumbs are
  // clickable (focusTo); the leaf is plain. Path = task names only — no layer
  // badge or other chrome (简洁性:层归属进入子任务面板后自明，不占路径)。
  {
    const crumbs=[...focusStack,{name:currentTask,title:meta.title||meta.id||currentTask}];
    h+=`<div class="crumbs">`;
    crumbs.forEach((c,i)=>{
      if(i>0)h+=`<span class="crumb-sep">/</span>`;
      const leaf=i===crumbs.length-1;
      const label=esc(c.title||c.name);
      if(leaf){
        h+=`<span class="crumb leaf">${label}</span>`;
      }else{
        h+=`<button class="crumb" onclick="focusTo(${i})">${label}</button>`;
      }
    });
    h+=`</div>`;
  }
  h+=`<div class="row1">`;
  h+=`<h1>${esc(meta.title||meta.id)}</h1>`;
  h+=`<span class="tag v">v${meta.version||'0.1'}</span>`;
  if(meta.id)h+=`<span class="tag agent">${esc(meta.id)}</span>`;
  if(focusStack.length)h+=`<button class="btn mini" onclick="backToParent()">← 上级</button>`;
  h+=`<span class="spacer"></span>`;
  // Global expand/collapse across all three sections (Task + Agent + DataSet)
  {
    const allIds=allExpandIds({r:R||[],o:O||[],s:S||[],a:A||[]},actors,state.agents||{},datasets||[],state.agentsAuto);
    const allOpen=allIds.length>0&&allIds.every(id=>openSet.has(id));
    h+=`<button class="btn" onclick="togIds([${allIds.map(id=>`'${id}'`).join(',')}])">${allOpen?'全部折叠':'全部展开'}</button>`;
  }
  h+=`<button class="btn" onclick="doImport()">导入</button>`;
  h+=`</div></div>`;

  // ---- Sticky section nav (任务 / 智能体 / 数据集) — jump to anchors ----
  h+=`<nav class="secnav">`;
  h+=`<button class="secnav-btn" onclick="scrollSec('sec-task')">任务</button>`;
  h+=`<button class="secnav-btn" onclick="scrollSec('sec-agent')">智能体</button>`;
  h+=`<button class="secnav-btn" onclick="scrollSec('sec-dataset')">数据集</button>`;
  h+=`</nav>`;

  // ---- Section: Task (ROSA problem space) ----
  h+=vsec('Task','问题空间 · R / O / S / A',taskExpandIds({r:R||[],o:O||[],s:S||[],a:A||[]},actors),'sec-task');
  h+=renderTaskView({R,O,S,A,actors});
  h+=`</section>`;

  // ---- Section: Agent (PCDATR skills) ----
  h+=vsec('Agent','解空间 · P / C / D / A / T / R',agentExpandIds(state.agents||{},state.agentsAuto),'sec-agent');
  h+=renderAgentView();
  h+=`</section>`;

  // ---- Section: DataSet (samples, always classic presentation) ----
  h+=vsec('DataSet',(datasets||[]).length+' 个样本',dsExpandIds(datasets||[]),'sec-dataset');
  h+=renderDatasets(datasets,actors);
  h+=`</section>`;

  h+=`<div class="import-area" onclick="doImport()">点击导入 task.md / JSON 或拖放文件到页面</div>`;
  $('app').innerHTML=h;
}

// Tooltip attribute helper: emit data-tip with the full (untruncated) text so
// any CSS-truncated element (ellipsis / line-clamp) reveals its full content on
// hover via the existing [data-tip] floating-card CSS. No-op when text is empty.
const tipAttr=t=>(t!=null&&String(t).trim())?` data-tip="${esc(String(t))}"`:'';

// Build a field's sub-field list for tree rendering. Shared by the classic
// column view and the new view styles so the field tree is identical everywhere.
// R-layer special case: formula/unit/threshold become the tree rows. Other
// layers: inline sub-fields first, then centralized actor (## 对象) fallback,
// merging准常量 specs (default/min/max/unit) and appending missing actor fields.
function buildFieldSubfields(f,letter,actorMap){
  const baseType=(f.type||'').replace(/\?$/,'').replace(/^Array</,'').replace(/>$/,'');
  const fallbackActor=actorMap[baseType];
  let subFields;
  if(letter==='r'){
    subFields=[];
    if(f.formula)subFields.push({key:'formula',type:f.formula});
    if(f.unit)subFields.push({key:'unit',type:f.unit});
    if(f.threshold)subFields.push({key:'threshold',type:f.threshold});
  }else{
    subFields=(f.subfields||[]).filter(x=>x.key!=='example').map(x=>({...x}));
    if(fallbackActor){
      const afMap={};for(const af of (fallbackActor.fields||[]))afMap[af.key]=af;
      for(const sf of subFields){
        const af=afMap[sf.key];
        if(!af)continue;
        if(sf.default==null&&af.default!=null)sf.default=af.default;
        if(sf.min==null&&af.min!=null)sf.min=af.min;
        if(sf.max==null&&af.max!=null)sf.max=af.max;
        if(!sf.unit&&af.unit)sf.unit=af.unit;
      }
      const have=new Set(subFields.map(x=>x.key));
      for(const af of (fallbackActor.fields||[])){
        if(af.key==='example'||af.key==='desc'||have.has(af.key))continue;
        subFields.push(af); have.add(af.key);
      }
    }
  }
  return subFields;
}

// Render the expanded field tree (<div class="tree">…</div>) + example media
// thumbnails. Caller MUST ensure the field hasTree && is open. Extracted from
// renderCols so every view style shows the identical field detail. Uses the
// same .tree/.tnode/.rg-media markup as the classic column view.
function renderFieldTreeHtml(f,letter,actorMap){
  const subFields=buildFieldSubfields(f,letter,actorMap);
  const fldHasSpec=letter!=='r'&&hasSpec(f);
  let h='<div class="tree">';
  for(const af of subFields){
    const subType=(af.type||'').replace(/\?$/,'').replace(/^Array</,'').replace(/>$/,'');
    const isRef=!!actorMap[subType];
    h+=`<div class="tnode"><span class="tk">${esc(af.key)}</span><span class="tt${isRef?' ref':''}">${esc(splitOpt(af.type).name)}</span>${splitOpt(af.type).opt?'<span class="tt-opt" title="可选/可空">可选</span>':''}</div>`;
    h+=specRowsHtml(af);
    if(isRef&&actorMap[subType]?.fields){
      h+=`<div style="margin-left:16px">`;
      for(const nf of actorMap[subType].fields){
        if(nf.key==='example')continue;
        h+=`<div class="tnode"><span class="tk">${esc(nf.key)}</span><span class="tt">${esc(splitOpt(nf.type).name)}</span>${splitOpt(nf.type).opt?'<span class="tt-opt" title="可选/可空">可选</span>':''}</div>`;
        h+=specRowsHtml(nf);
      }
      h+=`</div>`;
    }
  }
  if(fldHasSpec)h+=specRowsHtml(f);
  h+='</div>';
  // Example media thumbnails (field example > actor example; multi-view via comma)
  const baseType=(f.type||'').replace(/\?$/,'').replace(/^Array</,'').replace(/>$/,'');
  const fallbackActor=actorMap[baseType];
  const subExample=f.example||(f.subfields||[]).find(x=>x.key==='example')?.type||fallbackActor?.example||fallbackActor?.fields?.find(x=>x.key==='example')?.type;
  if(subExample){
    const exList=subExample.split(',').map(s=>s.trim()).filter(Boolean);
    if(exList.length){
      h+=`<div style="display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 2px 28px">`;
      for(const ex of exList){
        const ms=mediaSrc(ex);
        if(isImg(ms))h+=`<div class="rg-media"><img src="${esc(ms)}" loading="lazy" style="max-height:80px;border-radius:4px" onclick="openLb('${esc(ms)}','img')" onerror="this.parentElement.style.display='none'"></div>`;
        else if(isVid(ms))h+=`<div class="rg-media"><video src="${esc(ms)}" preload="metadata" style="max-height:80px;border-radius:4px" onclick="openLb('${esc(ms)}','vid')"></video></div>`;
      }
      h+=`</div>`;
    }
  }
  return h;
}

// Dataset section — always rendered in the classic presentation regardless of
// the active view style (the view styles only reskin the field/skill listing;
// sample cards stay as-is). Extracted verbatim from render() so every Task view
// can append it. Reads globals: currentTask, dsEdit, openSet, ROSA.
function renderDatasets(datasets,actors){
  if(!(datasets&&datasets.length)&&!currentTask)return '';
  datasets=datasets||[];
  let h='';
  const dsIds=collectDsIds(datasets);
  const dsAllOpen=dsIds.length>0&&dsIds.every(id=>openSet.has(id));
  h+=`<div class="sec-label" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span class="dot" style="background:var(--t3)"></span>Datasets`;
  h+=`<button class="ds-tbtn" onclick="togIds([${dsIds.map(id=>`'${id}'`).join(',')}])" style="margin-left:auto">${dsAllOpen?'全部折叠':'全部展开'}</button>`;
  if(currentTask){
    h+=`<button class="ds-tbtn${dsEdit?' on':''}" onclick="dsToggleEdit()">${dsEdit?'✓ 完成编辑':'✎ 编辑样本'}</button>`;
    h+=`<button class="ds-tbtn" onclick="dsAddSample()">+ 新增样本</button>`;
  }
  h+=`</div>`;
  h+=`<div class="samples">`;
  for(let i=0;i<datasets.length;i++){
    const s=normalizeSample(datasets[i]);
    if(dsEdit&&currentTask){ h+=dsEditableCard(i,s); continue; }
    const oid='sp-'+i;
    const op=openSet.has(oid);
    h+=`<div class="sample${op?' open':''}">`;
    h+=`<div class="sample-hd" onclick="tog('${oid}')">`;
    h+=`<span class="chev">▸</span>`;
    h+=`<span class="s-num">#${i+1}</span>`;
    h+=`<span class="s-label">${esc(s.label||s.id)}</span>`;
    h+=`<span style="margin-left:auto;font-size:12px;color:var(--t3);padding:2px 8px;border:1px solid var(--bd);border-radius:4px;flex-shrink:0">${op?'收起':'展开'}</span>`;
    if(s.scenario)h+=`<span class="s-scene">${esc(s.scenario)}</span>`;
    h+=`</div>`;
    h+=`<div class="sample-bd">`;
    const multi=(s.steps||[]).length>1;
    (s.steps||[]).forEach((st,si)=>{
      if(multi){
        h+=`<div class="frame-hd" style="display:flex;align-items:center;gap:8px;margin:8px 0 4px;padding:6px 10px;background:var(--bg);border:1px solid var(--bd);border-radius:6px">`;
        h+=`<span style="font-weight:700;color:var(--t2)">帧 ${si+1}</span>`;
        if(st.label)h+=`<span style="color:var(--t3)">${esc(st.label)}</span>`;
        if(si>0)h+=`<span style="margin-left:auto;font-size:12px;color:var(--t3)">← 上一帧的 oʼ/sʼ（转移后果）</span>`;
        h+=`</div>`;
      }
      const groups=[];
      for(const letter of ['o','s','a','r']){
        const data=st[letter]||{};
        if(Object.keys(data).length)groups.push({letter,data});
      }
      h+=`<div class="rosa-row">`;
      for(let j=0;j<groups.length;j++){
        const gr=groups[j];const rm=ROSA[gr.letter];
        h+=`<div class="rosa-group">`;
        h+=`<div class="rg-hd" style="background:${rm.color}10;color:${rm.color}"><span style="font-weight:800;font-size:17px">${gr.letter.toUpperCase()}</span> ${rm.label}</div>`;
        h+=`<div class="rg-body">`;
        let fi=0;
        for(const[k,v] of Object.entries(gr.data)){
          fi++;
          if(isImg(v)){
            const ms=mediaSrc(v);
            h+=`<div class="rg-kv"><span class="rg-fidx">${fi}</span><span class="rg-k" data-tip="${esc(fieldTip(k,actors))}">${esc(k)}</span></div>`;
            h+=`<div class="rg-media"><img src="${esc(ms)}" loading="lazy" onclick="openLb('${esc(ms)}','img')" onerror="this.parentElement.style.display='none'"></div>`;
          } else if(isVid(v)){
            const ms=mediaSrc(v);
            h+=`<div class="rg-kv"><span class="rg-fidx">${fi}</span><span class="rg-k" data-tip="${esc(fieldTip(k,actors))}">${esc(k)}</span></div>`;
            h+=`<div class="rg-media"><video src="${esc(ms)}" controls preload="metadata" onclick="openLb('${esc(ms)}','vid')"></video></div>`;
          } else if(isAud(v)){
            const ms=mediaSrc(v);
            h+=`<div class="rg-kv"><span class="rg-fidx">${fi}</span><span class="rg-k" data-tip="${esc(fieldTip(k,actors))}">${esc(k)}</span></div>`;
            h+=`<div class="rg-media" style="padding:10px 14px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:10px" onclick="openLb('${esc(ms)}','aud')">`;
            h+=`<span style="font-size:22px">&#9835;</span><span style="color:#16a34a;font-weight:600">点击播放音频</span></div>`;
          } else {
            const pv=tryParseVal(v);
            const vid='dv-'+i+'-'+si+'-'+gr.letter+'-'+k;
            const valHtml=typeof pv==='object'&&pv!==null
              ? `<div style="flex:1;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px">${renderDsVal(pv,vid)}</div>`
              : `<span class="rg-v">${esc(String(v))}</span>`;
            h+=`<div class="rg-kv"><span class="rg-fidx">${fi}</span><span class="rg-k" data-tip="${esc(fieldTip(k,actors))}">${esc(k)}</span>${valHtml}</div>`;
          }
        }
        h+=`</div></div>`;
      }
      h+=`</div>`;
    });
    h+=`</div></div>`;
  }
  h+=`</div>`;
  return h;
}

// Dispatch the Task (ROSA fields) listing to the active view style.
function renderTaskView(ctx){
  const {R,O,S,A,actors}=ctx;
  return renderPipeline('field',{r:R||[],o:O||[],s:S||[],a:A||[]},actors);
}
// Render the Agent (PCDATR skills) listing as a pipeline.
function renderAgentView(){
  return renderPipeline('skill',state.agents||{},state.actors);
}

/* ============ Pipeline renderer ============
 * Each renderer takes (kind, data, actors):
 *   kind='field' → data = {r,o,s,a} ROSA field arrays (Task tab)
 *   kind='skill' → data = {P,C,D,A,T,R} skill arrays     (Agent tab)
 * All views reuse the SAME toggle ids as classic — fld-<letter>-<idx> for field
 * detail, at-<L>-<idx> for skill cards, sio-… for in/out chips (via ioListHtml)
 * — so expansion state survives a view switch. Field detail reuses
 * renderFieldTreeHtml; skill in/out reuses ioListHtml. tint() builds a
 * translucent layer color via color-mix (works with both var(--c) and hex).
 */
const VIEW_LAYERS={field:['r','o','s','a'],skill:['P','C','D','A','T','R']};
const vMeta=(kind,letter)=>kind==='field'?ROSA[letter]:LAYERS[letter];
const vItems=(kind,data,letter)=>data[letter]||[];
const tint=(c,p)=>`color-mix(in srgb, ${c} ${p}%, transparent)`;
const vSkillDone=(l,sk)=>{const k=l+'-'+sk.id;return skillStatus[k]==='done'||sk.status==='done';};
// A trailing '?' on a type marks it optional/nullable (TS-style `T?`). Split it
// off so callers can render the name and an optional badge separately — avoids
// the raw '?' glueing onto the type name and reading as a question.
const splitOpt=t=>{const s=t||'';return s.endsWith('?')?{name:s.slice(0,-1),opt:true}:{name:s,opt:false}};
// Reduce a (possibly verbose) type token to a short surface category — the full
// type stays in the tooltip, sub-fields in the expansion tree. Keeps field pills
// compact (Array<机组状态项> → 数组) and non-redundant with the field name.
function typeCategory(t){
  if(!t)return '';
  const s=String(t).trim().replace(/\?$/,'');
  if(/^Array</.test(s)||s.endsWith('[]'))return '数组';
  const base=s.split(/[\s(<]/)[0].toLowerCase();
  if(['number','num','int','integer','float','double','long','decimal','byte'].includes(base))return '数字';
  if(['string','str','text','char'].includes(base))return '字符串';
  if(['bool','boolean'].includes(base))return '布尔';
  if(['date','time','timestamp','datetime'].includes(base))return '时间';
  return '对象';
}
// field meta WITHOUT key — surface chips only. Surface = type category (+ R
// weight). source/range/effect are details already carried in the field tooltip
// (fieldTip), so they are NOT rendered as chips here (简洁性:细节在 tooltip 看，
// 避免 source 长文本把字段名挤截断).
function vFieldMeta(f,letter,actors){
  let s='';
  if(f.type){
    // Surface = short category (数字/字符串/数组/对象…); full type in tooltip,
    // sub-fields in the expansion tree (细节在展开中看). Shown for every typed
    // field incl. structs (type==key) — 对象 flags "has structure".
    const opt=String(f.type).trim().endsWith('?');
    s+=`<span class="vf-type"${tipAttr(f.type)}>${esc(typeCategory(f.type))}</span>${opt?'<span class="vf-opt" title="可选 / 可空类型">可选</span>':''}`;
  }
  if(letter==='r'&&f.weight!=null)s+=`<span class="vf-w">${Math.round(f.weight*100)}%</span>`;
  return s;
}
// field head WITH key (key + meta) — for inline styles (compact/pipeline).
function vFieldHead(f,letter,actors){
  return `<span class="vf-key"${tipAttr(fieldTip(f.key,actors))}>${esc(f.key)}</span>`+vFieldMeta(f,letter,actors);
}
function vFieldHasTree(f,letter,actorMap){
  const sub=buildFieldSubfields(f,letter,actorMap);
  return sub.length>0||(letter!=='r'&&hasSpec(f));
}
// skill body: in/out chips (ioListHtml → sio- ids + trees).
function vSkillBody(sk,l,si){
  // Body = the in/out parameter cards only. The goal is not shown anywhere
  // (derived goals are noise; hand-written cards are titled by title/id).
  return ioListHtml(sk,l,si,'in')+ioListHtml(sk,l,si,'out');
}

/* ---- Pipeline: full-width vertical bands + ▼ between layers ----
 * Single rendering path: every task renders as a root panel (field + skill
 * bands). Subtasks are NOT inlined — a layer band only carries a link card
 * whose "→ 进入" focuses the child as its own panel (breadcrumb provides the
 * way back). This keeps the fractal claim honest: one canonical task view. */
function renderPipeline(kind,data,actors){
  const actorMap={};for(const a of (actors||[]))actorMap[a.id]=a;
  const order=VIEW_LAYERS[kind];
  let h='<div class="v-pipeline">';
  order.forEach((letter,idx)=>{
    const m=vMeta(kind,letter);const items=vItems(kind,data,letter);
    // Subtasks mounted on this layer (skill bands only, 分形递归): a quiet text
    // link next to the layer name. The child's name is deliberately NOT shown —
    // the tooltip carries name+goal, and focusing the child reveals its panel.
    const subs=kind==='skill'?(state.subtasks||[]).filter(s=>(s.layer||'').toUpperCase()===letter&&s.task):[];
    h+=`<div class="vp-band vp-band-${kind}" style="border-left-color:${m.color}"><div class="vp-hd"><span class="vp-ly" style="background:${tint(m.color,18)};color:${m.color}">${letter}</span><span class="vp-nm" style="color:${m.color}">${m.label}</span>`;
    for(const s of subs){
      const tip=(s.title||s.task)+(s.goal?'\n'+s.goal:'');
      // 同层多子任务时按钮必须带名，否则无法区分(ac 族每层≤1从未暴露此场景)
      const label=subs.length>1?`进入子任务·${esc(s.task)} →`:'进入子任务 →';
      h+=`<button class="vp-subenter" data-tip-pos="left" onclick="focusSubtask('${esc(s.task)}','${letter}')"${tipAttr(tip)}>${label}</button>`;
    }
    h+=`</div>`;
    if(!items.length){h+=`<div class="vp-empty">（无）</div>`;}
    else{
      h+=`<div class="vp-items">`;
      items.forEach((it,i)=>{
        if(kind==='field'){
          const f=it,fid='fld-'+letter+'-'+i,open=openSet.has(fid),has=vFieldHasTree(f,letter,actorMap);
          // Tree lives INSIDE the pill so an expanded field stays a self-contained
          // horizontal card (header + tree beneath, at card width) — it grows
          // taller, not wider, and never breaks out of the wrap flow.
          h+=`<div class="vp-pill"><div class="vp-pillhd" ${has?`onclick="tog('${fid}')"`:''}><span class="vp-idx">${i+1}</span>${vFieldHead(f,letter,actors)}${has?`<span class="vc-arr ${open?'open':''}">▸</span>`:''}</div>`;
          if(has&&open)h+=`<div class="vp-fld-tree">${renderFieldTreeHtml(f,letter,actorMap)}</div>`;
          h+=`</div>`;
        }else{
          const sk=it;
          if(state.agentsAuto){
            // Derived pipeline (no hand-written ## 解空间): UNWRAP the generic
            // agent card. The band label already names the layer, so a derived
            // goal ("采集所有观察数据") and completion checkbox add zero info —
            // noise. Render only the in/out parameter flow; that data lineage
            // (P→C→D→A→R) is the only useful content of a derived pipeline.
            h+=`<div class="vp-skflat">${vSkillBody(sk,letter,i)}</div>`;
          }else{
            // Hand-written skill: the title (author-chosen) labels the card; the
            // in/out parameter list is ALWAYS shown — only each parameter's own
            // internal tree toggles (sio-). No skill-level collapse: hiding the
            // param list would hide essential content; the per-param chevron is
            // the only expand level (简洁性 + 用户预期:参数名常驻可见)。
            const sk=it,done=vSkillDone(letter,sk);
            h+=`<div class="vp-pill"><div class="vp-pillhd" style="cursor:default"><span class="vp-skname${done?' done':''}"${tipAttr(sk.title||sk.id)}>${esc(sk.title||sk.id)}</span></div>`;
            h+=`<div class="vp-skbd">${vSkillBody(sk,letter,i)}</div>`;
            h+=`</div>`;
          }
        }
      });
      h+=`</div>`;
    }
    h+=`</div>`;
  });
  return h+'</div>';
}
// (inline subtask expansion was removed: subtasks open as their own focused
// panel via focusSubtask; the parent band only renders a skill-like link card.)


/* ========== Skill status toggle ========== */
function toggleSkill(layer,skillId){
  const key=layer+'-'+skillId;
  const next=skillStatus[key]==='done'?'pending':'done';
  skillStatus[key]=next;
  const skills=state.agents?.[layer]||[];
  const sk=skills.find(s=>s.id===skillId);
  if(sk)sk.status=next;
  render();
  fetch('/skill-status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({layer,skillId,status:next,task:currentTask})}).catch(()=>{});
}

/* ========== Import ========== */
function doImport(){
  const input=document.createElement('input');
  input.type='file';input.accept='.md,.json,.txt';
  input.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>loadFile(f.name,r.result);r.readAsText(f);};
  input.click();
}
function loadFile(name,text){
  if(name.endsWith('.md')||name.endsWith('.txt')){
    // 解析错误与加载(渲染/URL)错误分开报：pushState 等环境异常不该被标成 Parse error
    let d;try{d=parseTaskMd(text);}catch(e){alert('Parse error: '+e.message);return;}
    try{loadState(d);}catch(e){alert('Load error: '+e.message);}
  } else {loadJSON(text);}
}
function loadJSON(text){
  try{
    const d=JSON.parse(text);
    if(d.skillStatus)Object.assign(skillStatus,d.skillStatus);
    loadState(d);
  }catch(e){alert('JSON error: '+e.message);}
}

/* Drag and drop */
document.addEventListener('dragover',e=>{e.preventDefault();$('drop').classList.add('show')});
document.addEventListener('dragleave',e=>{if(!e.relatedTarget)$('drop').classList.remove('show')});
document.addEventListener('drop',e=>{
  e.preventDefault();$('drop').classList.remove('show');
  const f=e.dataTransfer.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>loadFile(f.name,r.result);r.readAsText(f);
});

/* ========== State + Task nesting (focus / breadcrumb) ========== */
let currentTask=null;
// Per-task UI reset for task SWITCHES (focus / breadcrumb / deep-link / import):
// expansions back to fresh-load defaults (re-seeded by expandAll inside
// applyState), sample edit-mode off, scroll back to top. SSE in-place refresh
// deliberately skips this — expansions and scroll must survive a hot reload.
function resetTaskUi(){openSet.clear();dsEdit=false;window.scrollTo(0,0);}
// Apply parsed state to the app: set state, currentTask, auto-expand, render.
// Pure — does NOT touch URL or focusStack. Callers needing URL/focus bookkeeping
// (loadState / loadByName / focusSubtask) wrap this; SSE uses it directly to
// refresh the focused leaf in place without disturbing the breadcrumb stack.
function applyState(d,name){
  state=d.skills?cv1(d):{meta:d.meta||{},actors:d.actors||[],R:d.R||[],O:merge(d.O),S:d.S||[],A:d.A||[],datasets:d.datasets||[],agents:d.agents||{},subtasks:d.subtasks||[],agentsAuto:d.agentsAuto||false};
  // Task identity = directory name (write endpoints + SSE watcher both key on it).
  // Priority: explicit nav name > URL path > frontmatter id. Bare meta.id would
  // write edits to the WRONG task when id != directory (e.g. viewing a copy).
  const p=location.pathname.replace(/^\/|\/$/g,'');
  const urlName=p&&!p.includes('.')&&p!=='aop.html'?decodeURIComponent(p.split('/')[0]):'';
  currentTask=name||urlName||(state.meta&&state.meta.id)||currentTask;
  expandAll();render();
}
function pushTaskUrl(name){
  const target='/'+name;
  // file:// 直开(origin null)时 Chrome 禁止 pushState 到绝对路径 — 跳过仅影响
  // 地址栏美化，不影响任何功能。拖拽导入/子任务跳转在 file:// 下因此曾全灭。
  if(window.location.pathname!==target){try{history.pushState(null,'',target);}catch(e){}}
  document.title=name+' — Task Design';
}
// Full load (init / import / deep-link): apply + URL + rebuild focusStack from
// frontmatter parent links.
function loadState(d){
  resetTaskUi();
  applyState(d,d.meta&&d.meta.id);
  const id=state.meta&&state.meta.id;
  if(id){pushTaskUrl(id);syncFocus(state.meta);}
  else render();
}
// Rebuild focusStack (root-first ancestors of currentTask, excluding the leaf)
// from frontmatter parent links. No-op reset when the task has no parent.
async function syncFocus(meta){
  if(!meta||!meta.parent){focusStack=[];render();return;}
  focusStack=await buildAncestors(meta);
  render();
}
// Walk the parent chain via fetch; returns root-first [{name,title}] excluding
// the current leaf. Each ancestor's title is read from its own frontmatter.
async function buildAncestors(meta){
  const chain=[];
  let child=meta.id;let i=0;
  while(child&&i++<20){
    let fm;try{const t=await fetch('/'+child+'/task.md').then(r=>{if(!r.ok)throw 0;return r.text();});fm=parseFrontMatter(t);}catch(e){break;}
    const parent=fm.parent; if(!parent)break;
    chain.unshift({name:parent,title:parent});
    child=parent;
  }
  for(const c of chain){
    if(c.title&&c.title!==c.name)continue;
    try{const fm=parseFrontMatter(await fetch('/'+c.name+'/task.md').then(r=>r.text()));c.title=fm.title||c.name;}catch(e){c.title=c.name;}
  }
  return chain;
}
// Load a task by name when its ancestor chain is unknown (init / deep-link /
// browser-back): fetch → apply → URL → rebuild focus from frontmatter.
function loadByName(name){
  currentTask=name;
  document.title=name+' — Task Design';
  fetch('/'+name+'/task.md')
    .then(r=>{if(!r.ok)throw new Error(r.status);return r.text();})
    .then(text=>{resetTaskUi();applyState(parseTaskMd(text),name);pushTaskUrl(name);syncFocus(state.meta);})
    .catch(()=>{render();});
}
// Focus a subtask from an inline pill's → 聚焦 action: push the current leaf
// onto focusStack, then fetch+apply the child. focusStack is managed explicitly
// (no rebuild) so navigation is instant and works even without frontmatter parent.
function focusSubtask(name,layer){
  // file:// 直开时浏览器禁止 fetch 本地路径(origin null)，子任务跳转注定失败。
  // 提前拦截并给出可操作的指引，而不是误导性的"不存在或加载失败"。
  if(location.protocol==='file:'){alert('file:// 模式不支持子任务跳转（浏览器安全限制）。\n\n请启动服务后使用：\n  node aop-server.mjs --dir ./tasks\n然后访问 http://localhost:8765/autoforklift_ROSA');return;}
  focusStack=focusStack.concat([{name:currentTask,title:(state.meta&&state.meta.title)||currentTask}]);
  fetch('/'+name+'/task.md')
    .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
    .then(text=>{ if(!text||text.length<8) throw new Error('empty'); resetTaskUi();applyState(parseTaskMd(text),name); pushTaskUrl(name); })
    .catch(()=>{ focusStack=focusStack.slice(0,-1); alert('子任务「'+name+'」不存在或加载失败'); });
}
// Navigate to ancestor i (0=root) of the current leaf: truncate focusStack so
// ancestor i becomes the new leaf, keeping only its predecessors.
function focusTo(i){
  if(i<0||i>=focusStack.length)return;
  const target=focusStack[i];
  focusStack=focusStack.slice(0,i);
  fetch('/'+target.name+'/task.md')
    .then(r=>r.text())
    .then(text=>{resetTaskUi();applyState(parseTaskMd(text),target.name);pushTaskUrl(target.name);});
}
function backToParent(){if(focusStack.length)focusTo(focusStack.length-1);}
window.addEventListener('popstate',()=>{
  const p=window.location.pathname.replace(/^\/|\/$/g,'');
  const name=p&&!p.includes('.')&&p!=='aop.html'?p:null;
  if(name&&name!==currentTask)loadByName(name);
});
/* ========== SSE ========== */
window.__onSSE=function(msg){
  if(msg.task&&currentTask&&msg.task!==currentTask)return;
  if(msg.file&&msg.state)applyState(msg.state,msg.task||undefined);
};
(function(){
  if(typeof EventSource==='undefined')return;
  try{
    const es=new EventSource('/events');
    es.addEventListener('update',e=>{try{window.__onSSE(JSON.parse(e.data));}catch(ex){}});
    es.addEventListener('reload',()=>{try{location.reload();}catch(ex){}});
    es.onerror=()=>{es.close();};
  }catch(e){}
})();

/* ========== Init ========== */
const __TASK_DATA__ = null;
function expandAll(){
  if(!state)return;
  // Skill param lists are always visible (no skill-level toggle), and ROSA field
  // sub-trees (fld-*) + param internal trees (sio-*) default collapsed — opened
  // by the user or 全部展开. Only dataset samples default to open here.
  for(let i=0;i<(state.datasets||[]).length;i++)openSet.add('sp-'+i);
  // Auto-expand sample value-trees that contain media (show embedded images)
  for(const id of mediaTreeIds(state.datasets||[]))openSet.add(id);
}
(function(){
  // Priority 1: server-injected __TASK_PATH__ (from /{task-name} route)
  // Priority 2: URL param ?task=name (fallback)
  // Priority 3: URL path /{name} with no extension
  const taskName = typeof __TASK_PATH__!=='undefined'&&__TASK_PATH__
    || new URLSearchParams(window.location.search).get('task')
    || (()=>{const p=window.location.pathname.replace(/^\/|\/$/g,'');return p&&!p.includes('.')&&p!=='aop.html'?p:null;})();

  if(taskName){loadByName(taskName);return;}
  // Priority 4: injected __TASK_DATA__ (legacy JSON injection)
  const d=typeof __TASK_DATA__!=='undefined'&&__TASK_DATA__;
  if(d){loadState(d);return;}
  // Priority 5: show import area
  render();
})();
// Handle template reload from server
if(typeof EventSource!=='undefined'){
  try{
    const _rs=new EventSource('/events');
    _rs.addEventListener('reload',()=>{location.reload();});
  }catch{}
}
</script>
