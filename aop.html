<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Design</title>
<link rel="icon" href="data:,">
<style>
:root{
  --cr:#10b981;--ca:#8b5cf6;--co:#3b82f6;--cs:#f59e0b;--cx:#ef4444;
  --cP:#7c3aed;
  --bg:#f7f8fa;--card:#fff;--bd:#e5e7eb;
  --t1:#1e293b;--t2:#64748b;--t3:#94a3b8;
  --mono:'SF Mono','Cascadia Code','Fira Code','Consolas',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--t1);font-size:18px;line-height:1.75;padding:32px 56px}

/* Banner — single compact line: title + tags + actions (简洁性:一行装完) */
.banner{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 24px 12px;margin-bottom:14px}
.banner .row1{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.banner h1{font-size:24px;font-weight:700;letter-spacing:-.5px;margin:0}
.banner .tag{padding:3px 10px;border-radius:5px;font-weight:600;font-size:12px;letter-spacing:.3px;vertical-align:middle}
.banner .tag.agent{background:#ede9fe;color:#7c3aed}
.banner .tag.v{background:#f1f5f9;color:var(--t2);font-family:var(--mono)}
.banner .row1 .spacer{flex:1}
.btn{padding:8px 18px;border:1px solid var(--bd);border-radius:6px;background:var(--card);cursor:pointer;font-size:14px;color:var(--t2);transition:all .12s}
.btn:hover{background:#f1f5f9}

/* Section labels */
.sec-label{display:flex;align-items:center;gap:10px;margin:22px 0 10px;font-weight:700;font-size:16px;color:var(--t2);letter-spacing:.3px;text-transform:uppercase}
.sec-label .dot{width:10px;height:10px;border-radius:50%}

/* Inline tree (actor fields & dataset objects) */
.tree{margin:4px 0 2px 28px;padding:6px 0 6px 12px;border-left:2px solid #ede9fe}
.tree .tnode{display:flex;align-items:baseline;gap:5px;padding:2px 0;font-size:15px;font-family:var(--mono);line-height:1.55}
.tree .tnode .tk{color:#7c3aed;font-weight:600;min-width:44px}
.tree .tnode .tt{color:var(--t3);font-size:14px}
.tree .tnode .tt.ref{color:#7c3aed;cursor:pointer}
.tree .tnode .tv{color:var(--t2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}

/* Tooltip */
[data-tip]{position:relative}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100% + 6px);top:auto;z-index:9999;background:#1e293b;color:#f1f5f9;padding:8px 12px;border-radius:8px;font-size:12px;font-weight:400;white-space:pre-wrap;width:max-content;max-width:min(560px,calc(100vw - 64px));overflow-wrap:break-word;text-align:left;pointer-events:none;line-height:1.6;font-family:var(--mono);box-shadow:0 6px 20px rgba(0,0,0,.25)}
/* Viewport-edge variants: elements anchored at a container edge (e.g. the
 * right-aligned subtask enter button) pin their tooltip to that same edge so
 * it can never extend past the viewport and spawn a horizontal scrollbar. */
[data-tip-pos="right"]:hover::after{left:auto;right:0;transform:none}
[data-tip-pos="left"]:hover::after{left:0;transform:none}

/* Column layout */
.cols{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.col{background:var(--card);border:1px solid var(--bd);border-radius:10px;overflow:visible;flex:auto;min-width:220px}
.col-empty .col-hd{cursor:default}
.col-hd{padding:12px 14px 5px;display:flex;align-items:center;gap:8px}
.col-hd:hover{background:#f8fafc}
.col-ly{font-family:var(--mono);font-size:18px;font-weight:800;padding:4px 10px;border-radius:5px;letter-spacing:1px}
.col-nm{font-weight:600;font-size:16px;white-space:nowrap}
.col-sub{font-size:14px;color:var(--t3);font-style:italic;padding:3px 14px 8px;line-height:1.4}

/* rosa field rows */
.rf{padding:5px 14px;font-size:15px;border-top:1px solid #f8fafc}
.rf:hover{background:#fafbfc}
.rf .row{display:flex;gap:8px;align-items:baseline}
.rf .k{font-family:var(--mono);font-size:15px;color:var(--t1);font-weight:500}
.rf .idx{font-family:var(--mono);font-size:13px;color:var(--t3);min-width:20px;text-align:right;font-weight:600}
.rf .t{font-family:var(--mono);font-size:14px;color:var(--ca)}
.rf .meta{font-size:14px;color:var(--t3);margin-left:auto;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.rf .sub{font-size:14px;color:var(--t3);margin-top:2px}
.rf .wt{font-family:var(--mono);font-size:14px;color:var(--cr);margin-left:auto;font-weight:600}
.fld-arr{display:inline-block;width:12px;text-align:center;color:var(--t3);cursor:pointer;transition:transform .12s;font-size:11px;flex-shrink:0}
.fld-arr.open{transform:rotate(90deg)}
.fld-arr.ph{cursor:default;visibility:hidden}

/* Skill items */
.sk{border-top:1px solid #f1f5f9}
.sk-hd{display:flex;align-items:center;gap:8px;padding:7px 14px;cursor:pointer;user-select:none}
.sk-hd:hover{background:#f8fafc}
.sk-arr{font-size:13px;color:var(--t3);transition:transform .12s;width:12px;text-align:center}
.sk.open .sk-arr{transform:rotate(90deg)}
.sk-idx{font-family:var(--mono);font-size:14px;color:var(--t3);min-width:16px;text-align:center;font-weight:600}
.sk-name{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;transition:color .15s}
.sk-name.done{color:var(--cr);font-weight:600}
.sk-bd{display:none;padding:6px 14px 10px 32px}
.sk.open .sk-bd{display:block}
.sk-desc{font-size:15px;color:var(--t3);margin-bottom:5px;line-height:1.5}
.sk-io{margin-bottom:5px}
.sk-iol{font-size:13px;font-weight:600;color:var(--t3);letter-spacing:.3px;display:block;margin-bottom:3px}
.sk-k{font-family:var(--mono);font-size:14px;color:var(--t2);display:block;padding:1px 0}
.sk-k.sk-k-exp{cursor:pointer}
.sk-k.sk-k-exp:hover{color:var(--c2)}
.sk-k-arr{margin-left:4px;color:var(--t3);font-size:11px}
.sk-io-tree{margin:0 0 6px 0}
/* Done state: entire body turns green */
.sk.done-state .sk-desc,.sk.done-state .sk-k,.sk.done-state .sk-iol{color:var(--cr)}
.sk.done-state .sk-desc{opacity:.7}
.sk.done-state .sk-k{opacity:.8}

/* Skill checkbox */
.sk-chk{width:22px;height:22px;border:2px solid var(--bd);border-radius:5px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;font-size:13px;color:transparent;background:var(--card)}
.sk-chk:hover{border-color:var(--cr);background:#f0fdf4;transform:scale(1.1)}
.sk-chk.done{background:var(--cr);border-color:var(--cr);color:#fff;font-size:13px;font-weight:800}

/* Dataset samples */
.samples{display:flex;flex-direction:column;gap:14px}
.sample{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:visible}
.sample-hd{padding:14px 22px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;cursor:pointer;user-select:none;border-bottom:1px solid #f8fafc}
.sample-hd:hover{background:#f8fafc}
.sample-hd .s-num{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--t3);background:#f1f5f9;padding:3px 12px;border-radius:5px;flex-shrink:0}
.sample-hd .s-label{font-weight:600;font-size:17px;white-space:nowrap;flex-shrink:0;min-width:0}
.sample-hd .s-scene{flex-basis:100%;font-size:13px;color:var(--t3);line-height:1.55;white-space:normal}
.sample-hd .chev{color:var(--t3);font-size:14px;transition:transform .12s}
.sample.open .sample-hd .chev{transform:rotate(90deg)}
.sample-bd{display:none;padding:18px 22px}
.sample.open .sample-bd{display:block}
.sample .rosa-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-bottom:12px;align-items:start}
.sample .rosa-group{min-width:0;border-radius:10px;overflow:visible;border:1px solid #e5e7eb}
.sample .rosa-group .rg-hd{padding:6px 16px;font-family:var(--mono);font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.sample .rosa-group .rg-body{padding:10px 16px}
.sample .rg-kv{font-size:15px;padding:4px 0;display:flex;gap:10px;align-items:baseline}
.sample .rg-fidx{font-family:var(--mono);font-size:13px;color:var(--t3);min-width:20px;text-align:right;font-weight:600}
.sample .rg-k{font-family:var(--mono);font-weight:500;color:var(--t1);min-width:80px}
.sample .rg-v{color:var(--t2);overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.sample .rg-media{margin-top:8px;border-radius:8px;overflow:hidden;display:inline-block;max-width:100%;cursor:pointer}
.sample .rg-media img{display:block;max-width:100%;max-height:320px;object-fit:contain;background:#f8fafc;border-radius:6px;transition:transform .15s}
.sample .rg-media img:hover{transform:scale(1.02)}
.sample .rg-media video{display:block;max-width:100%;max-height:320px;border-radius:6px}
.sample .rg-media audio{display:block;width:100%;max-width:400px}
.sample .tree{border-left-color:#d1d5db}

/* Dataset edit mode */
.ds-meta{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.ds-meta .ds-label-in{flex:0 0 220px;font-weight:600}
.ds-meta .ds-scene-in{flex:1;min-width:200px}
.ds-input{font:inherit;padding:6px 10px;border:1px solid var(--bd);border-radius:6px;background:#fff;color:var(--t1);min-width:0}
.ds-input:focus{outline:none;border-color:var(--t1);box-shadow:0 0 0 2px rgba(15,23,42,.06)}
.ds-edit-row{display:flex;align-items:center;gap:8px;padding:5px 0;flex-wrap:wrap}
.ds-edit-row .rg-k{min-width:90px}
.ds-edit-row .ds-input{flex:1;min-width:140px}
.ds-up{position:relative;overflow:hidden;cursor:pointer;font-size:13px;padding:4px 12px;margin:0}
.ds-up input{position:absolute;inset:0;opacity:0;cursor:pointer}
.ds-x{padding:2px 9px;font-size:16px;line-height:1.2}
.ds-thumb{height:46px;width:auto;max-width:80px;object-fit:cover;border-radius:5px;border:1px solid var(--bd)}
.ds-aud{display:inline-flex;align-items:center;justify-content:center;height:46px;width:46px;font-size:20px;background:#f0fdf4;border:1px solid #bbf7d0;color:#16a34a;border-radius:5px}
.ds-add{margin-top:8px;font-size:13px;color:var(--t3);padding:4px 10px}
.sec-label .ds-tbtn{font-size:12px;padding:3px 11px;border:1px solid var(--bd);border-radius:5px;background:var(--card);color:var(--t2);cursor:pointer;margin-left:8px}
.sec-label .ds-tbtn.on{background:var(--t1);color:#fff;border-color:var(--t1)}

/* Lightbox */
.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:1000;align-items:center;justify-content:center;cursor:pointer}
.lightbox.show{display:flex}
.lightbox img{max-width:92vw;max-height:90vh;object-fit:contain;border-radius:8px;box-shadow:0 8px 40px rgba(0,0,0,.5)}
.lightbox video{max-width:92vw;max-height:90vh;border-radius:8px}
.lightbox audio{width:400px}
.lightbox .lb-close{position:fixed;top:20px;right:28px;font-size:32px;color:#fff;cursor:pointer;z-index:1001;opacity:.7;transition:opacity .15s;font-weight:300}
.lightbox .lb-close:hover{opacity:1}

/* Import area */
.import-area{margin-top:18px;padding:24px;border:2px dashed var(--bd);border-radius:12px;text-align:center;color:var(--t3);font-size:16px;cursor:pointer;transition:all .2s}
.import-area:hover{border-color:#818cf8;color:#6366f1;background:rgba(99,102,241,.03)}

/* Responsive */
@media(max-width:900px){.col{min-width:260px}}
@media(max-width:600px){.col{min-width:240px}}

/* Drop overlay */
.drop{display:none;position:fixed;inset:0;background:rgba(99,102,241,.08);z-index:99;border:3px dashed #818cf8;pointer-events:none;align-items:center;justify-content:center;font-size:20px;color:#6366f1;font-weight:600}
.drop.show{display:flex}

/* Uncovered rosa field */
.rf.uncovered{background:#fefce8}
.rf.uncovered .k{color:#ca8a04}
.rf.uncovered .uncovered-tag{font-size:12px;color:#ca8a04;font-weight:600;margin-left:auto;white-space:nowrap}

/* ===== Sticky section nav (任务 / 智能体 / 数据集 jump bar) — quiet text tabs,
 * no card chrome (简洁性); page-bg fill so content doesn't bleed through when stuck ===== */
.secnav{position:sticky;top:0;z-index:50;display:flex;gap:4px;background:var(--bg);padding:6px 2px;margin:0 0 8px;border-bottom:1px solid var(--bd)}
.secnav-btn{font-size:13px;font-weight:600;color:var(--t2);background:transparent;border:none;border-radius:6px;padding:5px 10px;cursor:pointer;transition:color .12s}
.secnav-btn:hover{color:var(--cP)}

/* ===== Section wrappers (Task / Agent / DataSet stacked) ===== */
.vsec{margin-top:24px;scroll-margin-top:60px}
.vsec:first-of-type{margin-top:0}
.vsec-hd{display:flex;align-items:center;gap:12px;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--bd)}
.vsec-hd h3{margin:0;font-size:16px;font-weight:700;color:var(--t1);letter-spacing:.5px}
.vsec-hd .vsec-sub{font-size:12px;color:var(--t3);font-family:var(--mono)}
.vsec-hd .spacer{flex:1}
.btn.mini{font-size:11px;padding:3px 10px}

/* ===== Shared new-view primitives ===== */
.vf-key{font-weight:600;color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 auto;min-width:0}
.vf-type{font-family:var(--mono);font-size:13px;color:var(--cP);background:var(--bg);border:1px solid var(--bd);border-radius:3px;padding:0 4px;flex-shrink:0;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vf-w{font-family:var(--mono);font-size:13px;color:#ca8a04;background:#fefce8;border:1px solid #fde68a;border-radius:3px;padding:0 4px;flex-shrink:0}
.vf-meta{font-size:13px;color:var(--t3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:1;min-width:0}
/* Optional/nullable type badge — a trailing '?' on a type (TS-style `T?`) is
 * stripped from the name and surfaced as this distinct pill, so it never reads
 * as a literal question mark glued to the type ("能力包络?"). */
.vf-opt,.tt-opt{font-size:12px;color:#92400e;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:0 5px;line-height:16px;flex-shrink:0;cursor:help}
.tt-opt{margin-left:3px;line-height:14px}
.vsk-goal{font-size:12px;color:var(--t2);line-height:1.55;margin:0 0 8px;padding:6px 8px;background:var(--bg);border-radius:6px}
.vc-arr{display:inline-block;width:14px;flex-shrink:0;color:var(--t3);transition:transform .15s;font-size:11px}
.vc-arr.open{transform:rotate(90deg)}
.vc-arr.ph{visibility:hidden}

/* ===== Pipeline ===== */
.v-pipeline{display:flex;flex-direction:column;align-items:center;gap:8px}
.v-pipeline .vp-band{width:100%;background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--cP);border-radius:8px;padding:10px 14px}
.v-pipeline .vp-hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.v-pipeline .vp-ly{font-family:var(--mono);font-weight:700;font-size:14px;padding:2px 8px;border-radius:5px}
.v-pipeline .vp-nm{font-weight:700;font-size:15px}
.v-pipeline .vp-empty{color:var(--t3);font-size:13px;padding:4px 0}
/* Leaf params are horizontal cards; containers (bands, skill cards) stack
 * vertically. ROSA field pills ARE leaves → horizontal wrap. The tree lives
 * INSIDE the pill, so an expanded field stays a self-contained card: it grows
 * TALLER (header + tree beneath, at card width), never wider, never breaking
 * out of the wrap flow. align-items:flex-start so a tall open card doesn't
 * stretch its shorter siblings in the same row. */
.v-pipeline .vp-band-field .vp-items{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.v-pipeline .vp-band-field .vp-pill{flex:1 1 220px;min-width:180px;max-width:460px}
.v-pipeline .vp-band-field .vp-fld-tree{padding:6px 10px 8px;border-top:1px solid var(--bd)}
.v-pipeline .vp-band-field .vp-fld-tree .tree{margin-left:0}
/* PCDATR skill cards are CONTAINERS (hold goal + in/out leaves) → vertical,
 * full width each, so the horizontal in/out chips inside get the whole row. */
.v-pipeline .vp-band-skill .vp-items{display:block}
.v-pipeline .vp-band-skill .vp-pill{width:100%;margin-bottom:8px}
.v-pipeline .vp-band-skill .vp-pill:last-child{margin-bottom:0}
.v-pipeline .vp-pill{background:var(--bg);border:1px solid var(--bd);border-radius:6px}
.v-pipeline .vp-pillhd{display:flex;align-items:center;gap:6px;padding:7px 9px;font-size:15px;font-family:var(--mono);cursor:pointer}
.v-pipeline .vp-pillhd:hover{background:var(--card)}
.v-pipeline .vp-idx{color:var(--t3);font-size:13px;width:18px;flex-shrink:0;text-align:right}
.v-pipeline .vp-skname{font-weight:600;color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;font-family:inherit}
.v-pipeline .vp-skbd{padding:6px 8px 8px;border-top:1px solid var(--bd)}
.v-pipeline .vp-skbd .vsk-goal{margin-top:0}
/* Derived (autoGen) pipeline: no skill card — the in/out flow renders flat,
 * full-width under the band. Each .sk-io still puts its IN/OUT label on its
 * own line with chip-cards wrapping beneath. */
.v-pipeline .vp-skflat{width:100%;display:flex;flex-direction:column;gap:6px}
/* in/out LEAF params: horizontal cards — SAME card logic as ROSA field pills.
 * The IN/OUT label owns its own line (flex-basis:100%), then chip-cards wrap
 * beneath it. A chip carrying a field struct keeps its tree INSIDE (header +
 * tree beneath, at card width) — it grows taller, not wider, just like a ROSA
 * pill. Numbering is per group (IN 1..n, OUT 1..m), styled like .vp-idx. */
.v-pipeline .sk-io{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:stretch}
.v-pipeline .sk-iol{flex-basis:100%;font-size:13px;font-weight:700;color:var(--t3);letter-spacing:.3px;margin-bottom:2px;text-transform:uppercase}
.v-pipeline .sk-k{flex:1 1 160px;min-width:140px;max-width:340px;background:var(--card);border:1px solid var(--bd);border-radius:5px;cursor:pointer}
.v-pipeline .sk-k:hover{background:var(--bg)}
.v-pipeline .sk-k-hd{display:flex;align-items:center;gap:6px;padding:5px 8px;font-size:15px}
.v-pipeline .sk-k-key{flex:1;min-width:0;font-weight:600;color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v-pipeline .sk-k .rg-fidx{font-family:var(--mono);font-size:13px;color:var(--t3);font-weight:700;opacity:.8;flex-shrink:0}
.v-pipeline .sk-k-arr{color:var(--t3);font-size:13px;margin-left:auto;flex-shrink:0}
.v-pipeline .sk-io-tree{padding:4px 8px 6px;border-top:1px solid var(--bd)}
.v-pipeline .vp-skbd .vsk-goal{font-size:14px}
/* Subtask entry: a quiet text link right after the layer name. The child's full
 * name + goal live in the tooltip; entering reveals its full panel. No fill or
 * badge — the band header stays visually clean. */
.v-pipeline .vp-subenter{margin-left:4px;font:inherit;font-size:13px;font-weight:500;color:var(--t3);background:transparent;border:none;border-radius:4px;padding:2px 4px;cursor:pointer;white-space:nowrap;transition:color .12s}
.v-pipeline .vp-subenter:hover{color:var(--cP);text-decoration:underline}
/* Nested inline subtask pipeline: indent + a left rail to signal depth */
.v-pipeline.sub{margin-left:14px;border-left:2px solid var(--bd);padding-left:10px}
.v-pipeline.sub .vp-band{padding:8px 10px}

/* ===== Breadcrumb (task path) ===== */
.crumbs{display:flex;align-items:center;flex-wrap:wrap;gap:4px;margin-bottom:6px;font-size:13px}
.crumbs .crumb{font-family:inherit;font-size:13px;color:var(--cP);background:transparent;border:none;padding:2px 6px;border-radius:5px;cursor:pointer}
.crumbs .crumb:hover{background:var(--bg);text-decoration:underline}
.crumbs .crumb.leaf{color:var(--t1);font-weight:700;padding:2px 6px;display:inline-flex;align-items:center;gap:6px}
.crumbs .crumb-sep{color:var(--t3);opacity:.6}
</style>
</head>
<body>
<div id="app"></div>
<div class="drop" id="drop">Drop JSON / task.md</div>
<div class="lightbox" id="lb" onclick="closeLb()">
  <span class="lb-close" onclick="closeLb()">✕</span>
  <div id="lbContent" onclick="event.stopPropagation()"></div>
</div>
<script>
const esc=s=>(s??'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const $=id=>document.getElementById(id);
let state=null;
// Focus stack for task nesting (分形递归): root-first ancestors of the currently
// focused (leaf) task, each {name,title,layer}. The leaf itself is `currentTask`
// + state.meta — NOT in focusStack. Breadcrumb = [...focusStack, leaf]. Empty at
// root. Managed explicitly by focusSubtask/focusTo/backToParent; rebuilt from
// frontmatter parent-chain on deep-link / init (syncFocus).
let focusStack=[];
const openSet=new Set();
const skillStatus={};
let dsEdit=false;          // 样本编辑模式（需 currentTask 服务端 task.md）

function tog(id){openSet.has(id)?openSet.delete(id):openSet.add(id);render();}
// Toggle a batch of explicit ids: if all open → collapse all, else → expand all
function togIds(ids){
  const allOpen=ids.every(id=>openSet.has(id));
  allOpen?ids.forEach(id=>openSet.delete(id)):ids.forEach(id=>openSet.add(id));

}
// Toggle ids by prefix+range — single (count===1, id=prefix) or indexed (id=prefix-i)
function togAll(prefix,count){
  const ids=[];
